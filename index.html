<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A81B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>الدفاع المدني — دولة قطر</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#A81B2D; --red2:#C4213A; --red-dk:#8A1224;
  --gold:#F3C13A; --gold-dk:#E3A81C; --gold-soft:#FDF3D6;
  --ink:#1F1A16; --body-c:#3B342E; --muted:#7C6F64;
  --bg:#F4F1EB; --card:#FFFFFF; --line:#E7DFD4; --line2:#F0EAE1;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:16px;
  --sh:0 2px 10px rgba(60,40,20,.07);
  --sh2:0 6px 22px rgba(60,40,20,.12);
  --chevron:repeating-linear-gradient(115deg,var(--red) 0 20px,#fff 20px 22px,var(--gold) 22px 42px,#fff 42px 44px);
  --shutter:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 3px,rgba(0,0,0,.30) 3px 7px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--body-c);font-family:var(--body);font-size:15px;line-height:1.7;
  overflow-x:hidden;min-height:100dvh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{max-width:760px;margin:0 auto;padding:18px 14px 120px}

/* ===== الشريط العلوي ===== */
.top{position:sticky;top:0;z-index:60}
.top .band{height:5px;background:var(--chevron)}
.topin{max-width:760px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;
  border-radius:0 0 18px 18px;box-shadow:0 4px 16px rgba(168,27,45,.28)}
.ttl{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.16);color:#fff;
  display:grid;place-items:center;flex:none;transition:.16s}
.tbtn:active{transform:scale(.92)}
.tbtn svg{width:18px;height:18px}
.tbtn.lang{width:auto;padding:0 12px;font-family:var(--mono);font-size:12px;font-weight:600}
.tbtn.hide{display:none}
html[dir="rtl"] .tbtn.bk svg{transform:scaleX(-1)}

/* ===== عناوين ===== */
.eyebrow{font-family:var(--display);font-size:14px;font-weight:700;color:var(--red);
  display:flex;align-items:center;gap:9px;margin:22px 0 10px}
.eyebrow::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--line),transparent)}
h1{font-family:var(--display);font-weight:900;font-size:23px;line-height:1.3;margin:0 0 6px;color:var(--ink)}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 8px;color:var(--ink)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}

/* ===== شعار الرئيسية ===== */
.crest{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);
  padding:22px 16px 18px;text-align:center;margin:16px 0 6px}
.crest .badge{width:auto;height:auto;margin:0 auto 4px;display:grid;place-items:center;background:none}
.crest img{width:120px;height:120px;object-fit:contain}
.crest svg{width:96px;height:96px}
.crest b{display:block;font-family:var(--display);font-weight:900;font-size:18px;color:var(--ink);margin-top:12px}
.crest span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;direction:ltr}
.crest .rule{width:70px;height:4px;border-radius:3px;background:var(--gold);margin:13px auto 0}

/* ===== شبكة السيارات ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:var(--sh);transition:.16s;text-align:start;color:var(--ink);display:block;width:100%}
.vcard .lbl b,.vcard .lbl span{color:#2E2200}
.vcard:active{transform:scale(.98)}
.vcard .pic{background:none;padding:8px 8px 4px;border-bottom:0;display:grid;place-items:center}
.carimg{width:100%;aspect-ratio:900/560;object-fit:contain;display:block;border-radius:12px;
  background:#F7F4EE;box-shadow:0 2px 6px rgba(0,0,0,.16)}
.carhero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:8px;margin-bottom:14px}
.carhero img{width:100%;aspect-ratio:900/560;object-fit:contain;display:block;border-radius:12px;
  background:#F7F4EE;box-shadow:0 2px 8px rgba(0,0,0,.18)}
html[data-theme="dark"] .carhero{background:#241F1A;border-color:#3E342B}
.vcard .lbl{background:var(--card);border-top:2px solid var(--gold);padding:9px 10px 11px;text-align:center}
.vcard .lbl b{display:block;font-family:var(--display);font-weight:900;font-size:14.5px;color:var(--ink);line-height:1.35}
.vcard .lbl span{display:block;font-size:11.5px;font-weight:600;color:var(--red);margin-top:3px}
.vcard .pic{position:relative}
.vcard .pic::after{content:"";position:absolute;inset-inline:12%;bottom:6px;height:10px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent)}
.vcard .elev{filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}

/* ===== أشرطة اختيار الخانة ===== */
.bays{background:linear-gradient(180deg,var(--red2),var(--red));border-radius:16px;padding:11px;margin-bottom:12px;
  box-shadow:var(--sh)}
.bayrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.bayrow.top{margin-bottom:7px}
.bchip{min-width:52px;height:34px;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;
  font-family:var(--mono);font-size:11.5px;font-weight:600;display:grid;place-items:center;padding:0 9px}
.bbtn{min-width:58px;height:48px;border-radius:12px;background:var(--gold);color:#3a2c05;
  font-family:var(--display);font-weight:900;font-size:19px;display:grid;place-items:center;
  box-shadow:0 2px 0 var(--gold-dk);transition:.14s}
.bbtn:active{transform:translateY(2px);box-shadow:none}
.bbtn.on{background:#fff;color:var(--red);box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.bbtn.wide{min-width:96px;font-size:13px;font-family:var(--body);font-weight:700}

/* ===== لوحة الرسم ===== */
.draw{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);
  padding:8px 6px 4px;margin-bottom:12px}
.elev{width:100%;height:auto;display:block;direction:ltr}
.elev .bay{cursor:pointer}
.elev .cavity{fill:#2a2320}
.elev .shutter{fill:#9aa3a8;transform-origin:center top;transition:transform .32s cubic-bezier(.3,.9,.3,1)}
.elev .bay.open .shutter{transform:scaleY(.1)}
.elev .baylbl{font-family:var(--mono);font-size:13px;font-weight:600;fill:#2a2320;pointer-events:none}
.elev .bay.open .baylbl{fill:var(--gold)}
.elev .frame{fill:none;stroke:#2a2320;stroke-width:2}
.elev .bay.open .frame{stroke:var(--gold);stroke-width:2.5}
.elev .cablbl{font-family:var(--mono);font-size:11px;fill:#fff;opacity:.9;pointer-events:none}

/* ===== بطاقات وبيانات ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;margin-bottom:12px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:12px 0 4px}
.spec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--sh)}
.spec b{display:block;font-size:11px;color:var(--muted);font-weight:500}
.spec i{font-style:normal;font-size:15px;font-weight:700;color:var(--ink)}
.mtag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card)}
.mtag b{color:var(--ink);font-weight:700}
.metarow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.codechip{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:8px;
  background:var(--gold-soft);color:#7a5c05;border:1px solid #EBD9A2;white-space:nowrap}

/* ===== الخانات ===== */
.comp{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  margin-bottom:9px;overflow:hidden}
.comp.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(243,193,58,.35),var(--sh)}
.comp>.ch{display:flex;align-items:center;gap:11px;width:100%;padding:13px;text-align:start}
.tag{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-family:var(--display);font-weight:900;font-size:16px;background:var(--gold);color:#3a2c05}
.comp .ch .t{flex:1;min-width:0}
.comp .ch .t b{display:block;font-weight:700;font-size:14.5px;color:var(--ink)}
.comp .ch .t span{display:block;font-size:11.5px;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.comp.active .chev{transform:rotate(-90deg);color:var(--red)}
html[dir="rtl"] .chev{transform:scaleX(-1)}
html[dir="rtl"] .comp.active .chev{transform:scaleX(-1) rotate(90deg)}
.body{display:none;padding:0 10px 10px;animation:fade .22s ease}
.comp.active .body{display:block}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.cnote{border-inline-start:4px solid var(--red);background:#FDF0F1;border-radius:9px;padding:9px 12px;
  font-size:12.5px;color:#7c2531;margin-bottom:9px}

/* ===== بطاقات المعدات ===== */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  padding:9px;text-align:center;display:flex;flex-direction:column;transition:.15s}
.item:active{transform:scale(.98)}
.item .ph{height:92px;border-radius:10px;background:#F7F3ED center/contain no-repeat;display:grid;place-items:center;
  margin-bottom:8px;border:1px solid var(--line2)}
.item .ph svg{width:30px;height:30px;color:#C9BCAC}
.item b{display:block;font-family:var(--display);font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.4}
.item i{font-style:normal;display:block;font-size:11px;color:var(--muted);margin-top:3px;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .go{margin-top:8px;background:var(--gold);color:#3a2c05;border-radius:9px;padding:6px;
  font-size:11.5px;font-weight:700;box-shadow:0 2px 0 var(--gold-dk)}
.item .qty{font-family:var(--mono);font-size:11px;color:var(--red)}
.empty{border:2px dashed var(--line);border-radius:13px;padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--card)}
.empty b{display:block;color:var(--ink);font-weight:700;margin-bottom:3px;font-size:14px}

/* ===== شاشة المعدة ===== */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;margin-bottom:14px}
.hero .cv{height:6px;background:var(--chevron)}
.hero .shot{background:#F7F3ED;border-bottom:1px solid var(--line2)}
.hero .shot img{display:block;width:100%;height:250px;object-fit:contain;padding:8px}
.hero .noshot{height:150px;display:grid;place-items:center;background:#F7F3ED;border-bottom:1px solid var(--line2)}
.hero .noshot svg{width:46px;height:46px;color:#CFC2B2}
.hero .in{padding:14px 15px 16px;text-align:center}
.chip{display:inline-block;font-size:11px;padding:4px 11px;border-radius:999px;
  background:var(--gold-soft);color:#7a5c05;border:1px solid #EBD9A2}
.hero h1{margin:9px 0 3px;font-size:21px}
.hero .en{font-family:var(--mono);font-size:12.5px;color:var(--muted);direction:ltr}
.crumb{font-size:12px;color:var(--muted);margin:0 0 14px;text-align:center}

/* صفوف الشرح ذات اللسان الذهبي */
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  margin-bottom:10px;display:flex;overflow:hidden}
.row .lab{background:var(--gold-soft);border-inline-start:1px solid #EBD9A2;padding:12px 10px;min-width:96px;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;
  font-size:13px;color:#7a5c05;text-align:center}
.row .val{flex:1;min-width:0;padding:12px 14px;font-size:14px}
.row .val ul{margin:0;padding-inline-start:17px}
.row .val li{margin-bottom:5px}
.row.danger .lab{background:#FDF0F1;border-inline-start-color:#F3D2D6;color:#9B2130}
.row.danger .val li::marker{color:var(--red)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:9px;margin-bottom:8px}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:11px;font-weight:700;
  width:21px;height:21px;flex:none;border-radius:7px;background:var(--gold);color:#3a2c05;
  display:grid;place-items:center;margin-top:3px}
.navbar{position:fixed;inset-inline:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:78;
  display:flex;gap:9px;background:linear-gradient(180deg,var(--red2),var(--red));
  padding:10px 12px;max-width:760px;margin:0 auto;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.navbar.rel{position:static;border-radius:14px;margin-top:14px;box-shadow:var(--sh)}
.shell.withnav{padding-bottom:190px}
.navbar button{flex:1;background:var(--gold);color:#3a2c05;border-radius:10px;padding:11px;
  font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 2px 0 var(--gold-dk)}
.navbar button:disabled{opacity:.4}
.navbar svg{width:15px;height:15px}
html[dir="rtl"] .navbar svg{transform:scaleX(-1)}

/* ===== بحث ===== */
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;margin-bottom:14px;box-shadow:var(--sh)}
.searchbar input{flex:1;background:none;border:0;outline:none;font-size:15px;min-width:0}
.searchbar svg{width:17px;height:17px;color:var(--muted);flex:none}
.sitem{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;text-align:start;background:var(--card);
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--sh)}
.sitem .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
.sitem .t{flex:1;min-width:0}
.sitem .t b{display:block;font-weight:700;font-size:14px;color:var(--ink)}
.sitem .t span{display:block;font-size:11.5px;color:var(--muted)}

/* ===== أزرار ===== */
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin:14px 0 10px}
.back svg{width:15px;height:15px}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 15px;
  font-size:13.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:7px;
  box-shadow:var(--sh);transition:.15s}
.btn:active{transform:scale(.96)}
.btn svg{width:15px;height:15px}
.btn.p{background:var(--gold);border-color:var(--gold-dk);color:#3a2c05;box-shadow:0 2px 0 var(--gold-dk)}
.btn.d{color:#9B2130;border-color:#F0CDD2;background:#FDF3F4}
.btn.blk{width:100%;justify-content:center}

/* ===== أوراق سفلية ===== */
.scrim{position:fixed;inset:0;background:rgba(35,24,18,.5);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:95;background:var(--card);
  border-radius:22px 22px 0 0;max-height:88dvh;overflow-y:auto;transform:translateY(102%);
  transition:transform .28s cubic-bezier(.3,.9,.3,1);padding:0 16px calc(20px + env(safe-area-inset-bottom));
  max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(60,40,20,.2)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet h3{font-family:var(--display);font-size:17px;margin:8px 0 14px;color:var(--ink)}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;background:#FBF8F4;border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;outline:none;font-size:14.5px;transition:.15s;color:var(--ink)}
.f input:focus,.f textarea:focus{border-color:var(--gold-dk);background:#fff}
.f textarea{min-height:88px;resize:vertical;line-height:1.7}
.f .hint{font-size:11px;color:var(--muted);margin-top:4px}
.f.ltr input,.f.ltr textarea{direction:ltr;text-align:start;font-family:var(--mono);font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{height:150px;border-radius:12px;border:2px dashed var(--line);background:#FBF8F4 center/contain no-repeat;
  display:grid;place-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
.prev.has{border-style:solid}
.prev i{font-style:normal;background:rgba(255,255,255,.8);padding:5px 12px;border-radius:999px}
.prev.has i{display:none}

/* ===== شريط التبويبات ===== */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;
  box-shadow:0 -3px 16px rgba(60,40,20,.07)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;
  color:var(--muted);font-size:10.5px;font-weight:700;border-radius:12px;position:relative;transition:.15s}
.tabs button svg{width:21px;height:21px}
.tabs button.on{color:var(--red)}
.tabs button.on::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:2px;background:var(--gold)}
.tabs .bdg{position:absolute;top:2px;inset-inline-end:22%;min-width:16px;height:16px;border-radius:9px;
  background:var(--red);color:#fff;font-size:9.5px;font-family:var(--mono);display:none;place-items:center;padding:0 4px}
.tabs .bdg.on{display:grid}

/* ===== الحساب ===== */
.acct{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.acct .cv{height:6px;background:var(--chevron)}
.acct .in{padding:16px;display:flex;align-items:center;gap:13px}
.avatar{width:54px;height:54px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--red2),var(--red-dk));font-family:var(--display);font-weight:900;font-size:20px;color:#fff}
.acct .who{flex:1;min-width:0}
.acct .who b{display:block;font-family:var(--display);font-size:17px;color:var(--ink)}
.acct .who span{display:block;font-size:12.5px;color:var(--red);font-weight:700;margin-top:2px}
.acct .who i{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px;direction:ltr;text-align:start}

const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const v = window.localStorage && localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async set(k,v){
    const s = JSON.stringify(v);
    try{ if(window.storage){ await window.storage.set(k,s); return true; } }catch(e){}
    try{ localStorage.setItem(k,s); return true; }catch(e){ return false; }
  },
  async del(k){
    try{ if(window.storage){ await window.storage.delete(k); return; } }catch(e){}
    try{ localStorage.removeItem(k); }catch(e){}
  },
  async keys(prefix){
    try{ if(window.storage){ const r = await window.storage.list(prefix); return (r&&r.keys)||[]; } }catch(e){}
    try{ return Object.keys(localStorage).filter(k=>k.startsWith(prefix)); }catch(e){ return []; }
  }
};

'دعامية تثبيت العجلة':['A metal or rubber chock placed against the tyre to stop the vehicle rolling.','Stopping the appliance moving while parked and working','Place them front and rear of the tyre\nAlways use them on a slope','Parking on a slope without chocks lets the vehicle move during the work'],
'بلك شحن البطارية':['A charging socket fitted in the vehicle body connected to the station charger.','Charging point built into the appliance','Confirm it is disconnected before moving off','Driving off connected damages the socket'],
'رافعة السيارة (جيك)':['A hydraulic jack that lifts part of the vehicle weight a short distance.','Lifting the vehicle to change a wheel or inspect underneath','Solid level ground, parking brake and chocks\nPlace it under the designated lifting point\nFit the stand before any work underneath','Never put any part of your body under a vehicle held on the jack alone'],
'مفتاح عجل':['A wrench matching the wheel nut size of the appliance.','Loosening and tightening wheel nuts','Crack the nuts before lifting and tighten fully after lowering\nTighten in a crossing pattern','Uneven tightening warps the wheel\nA slipping wrench injures the hand'],
'مثلث تحذير':['A reflective triangular plate set on the road to be seen from a distance.','Warning drivers that the appliance is stopped','Put on the reflective vest and place it facing oncoming traffic at a sufficient distance','Standing in the traffic lane while placing it'],
'كشاف ضوء تحذيري':['A flashing lamp marking a position or a hazard in the dark.','Marking the work area or equipment at night','Place it high and visible and secure it against the wind','It alone does not secure the scene — cones and signs are still needed'],
'وصلة تعبئة الهواء':['An adaptor between the compressed air supply and the cylinder valve.','Connecting breathing air cylinders to the filling supply','Tighten the connection before opening the pressure\nOpen slowly and watch the gauge','Opening quickly heats the cylinder and strains the fitting\nOil or grease on air fittings is an ignition hazard'],
'سترات تحذيرية (شياحات)':['Fluorescent vests with reflective bands making the firefighter visible from a distance.','Making the firefighter visible to drivers while working on the road','Worn over the tunic before stepping onto the road','Working on the road without a reflective vest is a direct danger'],
'طربال معدات':['A tarpaulin spread on the ground to lay out equipment at the incident.','Laying out and organising equipment near the work point','Spread it in a safe area close to the appliance\nArrange the tools in order of use','Tools left loose on the ground are lost or become a trip hazard'],
'قفص أحمر':['A cage or box holding assorted small equipment together in the locker.','Storing and carrying small assorted equipment','Check its contents at the start of the shift','Missing items are only discovered when they are needed'],
'شيول صغير':['A small shovel for light work and confined spaces.','Collecting and spreading material in tight spaces','Hold with both hands and lift with the legs, not the back','Glass or exposed cables may lie under the debris'],
'سترة احتياط':['A spare fire tunic kept on the appliance as a field replacement.','Replacing a firefighter tunic that is contaminated or damaged','Replace any tunic contaminated with fuel or heavy smoke at once','Working in a fuel-soaked tunic makes the firefighter an ignition source\nA soaked tunic conducts heat to the skin'],
'أقراص حديدية':['Abrasive discs made for cutting metal.','Cutting steel with the disc cutter','Check the disc matches the machine\nInspect it for cracks before fitting','A cracked disc explodes in the first second of running\nA metal disc used on concrete shatters and throws fragments'],
'واقي عجلة القيادة':['A cover fitted over the steering wheel that contains an undeployed airbag.','Covering the airbag while working inside the vehicle','Fit it before any work starts inside the vehicle\nDisconnect the vehicle battery if possible','An undeployed airbag fires suddenly with force enough to kill whoever is in front of it'],
'كيبل استيل':['A stranded steel rope carrying high pulling loads.','Pulling and towing heavy loads','Inspect it for broken strands before use and wear leather gloves\nClear the line of pull','A cable failing under tension whips like a lash\nBroken strands cut the hand'],
'كيبل قلص كتان':['A wide webbing sling for lifting and securing without marking the surface.','Lifting and securing where a steel rope would damage the surface','Inspect it for cuts and heat damage before loading\nDo not run it over a sharp edge','A cut or heat-damaged sling fails under load'],
'سلسلة':['A steel chain used with shackles and the winch for securing and pulling.','Securing, anchoring and pulling during moves','Anchor to a strong load-bearing point\nClear the line of pull before loading','A damaged chain fails under tension\nAnchoring to a weak point tears it out and it flies'],
'رؤوس مفك':['Interchangeable tips changing the function of the hydraulic spreader.','Fitting different tips for pulling, spreading or pushing','Release the pressure before changing any tip\nCheck the tip is locked before loading','An unlocked tip is thrown out under pressure'],
'وصلات مخدات هوائية':['Quick couplings connecting the air hoses between the bags and the regulator.','Connecting the lifting bags to the regulator and manifold','Tighten every connection before inflating\nCheck for leaks','A coupling releasing under pressure flies violently\nA leak drops the load suddenly'],
'كشاف بحث':['A powerful wide-beam search light.','Lighting a wide area during a search','Sweep steadily and keep the beam out of the crew eyes','A strong beam reflects in smoke and reduces visibility'],
'قواعد تثبيت السيارة':['Wooden or plastic cribbing built under the vehicle to stop it moving.','Stabilising the crashed vehicle before cutting and spreading','Stabilise the vehicle first however stable it looks\nCrib from four points\nRe-check after every cutting stage','An unstabilised vehicle moves suddenly onto the casualty or the crew\nTall narrow cribbing topples'],
'معدة كسر الزجاج مع شفرة احتياط':['A tool with a punch or blade that shatters toughened glass or saws laminated glass.','Breaking vehicle glass and cutting laminated screens to make an opening','Cover the casualty before breaking\nStart at the glass furthest from the casualty\nCut laminated glass with the saw, do not smash it','A laminated windscreen needs a saw, not a punch\nFragments injure the casualty and the crew'],
'جيك هيدروليك L TR4340C':['A hydraulic ram extending in length to push two opposing parts apart.','Pushing vehicle parts apart to create an extrication space','Set the base on a strong, stable point\nExtend gradually and watch for the base slipping\nCrib after each stage','A slipping base throws the ram violently\nPushing on a weak point tears the metal instead of moving it'],
'جيك هيدروليك L TR4350C':['A hydraulic ram with a longer stroke for wider gaps.','Pushing parts apart across a longer span','Choose the right length before starting\nSecure the base well','A longer ram is less stable and needs a wider base'],
'جيك هيدروليك T RA4332C':['A short hydraulic ram with a T head spreading the load over two points.','Pushing in confined spaces','Set the head on a strong point and extend gradually','A head on a smooth surface slips under pressure'],
'معدة تثبيت السيارة':['Struts and straps preventing the vehicle from moving during the rescue.','Stabilising an overturned or leaning vehicle','Stabilise both sides before anyone enters the vehicle\nStrap the struts in place','Working on an unstabilised vehicle is a fatal risk to casualty and crew'],
'بلك شحن مع ملحقات الكشاف':['A charging unit in the locker with mounts for the torches.','Charging the torches and portable equipment on board','Return the torches to charge after every use','A flat torch is useless when it is needed'],
'حمالة كتان':['A wide webbing sling used for lifting and securing.','Lifting and securing loads','Inspect it for cuts and heat damage before loading\nUse edge protection over a corner','A cut sling fails suddenly under load'],
'فلتر ورقي':['A paper filter element cleaning the air entering an equipment engine.','Spare filter for the saw or generator engine','Replace it when dirty or per the service schedule','A blocked filter chokes the engine and stops it mid-operation'],
'جركل تعبئة':['An approved container for carrying and storing fuel with a sealed cap and vent.','Fuel for the saws, generator and powered equipment','Refuel with the engine stopped and cool\nUse a funnel and wipe any spill at once\nKeep it tightly closed','Petrol vapour ignites from a spark or a hot surface\nAn open can fills the locker with explosive vapour'],
'جالون زيت السلسلة':['A viscous oil lubricating the saw chain and cooling the bar.','Lubricating the chainsaw chain','Check the oil tank before every start','Running without oil ruins the chain and increases kickback'],
'منشار ميكانيكي بنزين مع سلسلة احتياط':['A petrol chainsaw driving a toothed chain around a guide bar, with a spare chain.','Cutting timber, doors and roofs and opening access','Check chain tension and oil before starting\nStart it on the ground away from fuel\nStand firmly and hold with both hands\nNever cut above shoulder height','Kickback from the bar tip throws the saw towards the face\nA loose chain comes off the bar\nMaterial under tension springs when cut\nEngine exhaust is toxic in enclosed spaces'],
'أزميل':['A steel bar with a cutting edge driven by hammer blows to cut or prise material.','Prising, splitting and cutting metal by striking','Hold it at a steady angle and strike with a suitable hammer','Fragments fly when striking — a face shield is required\nA mushroomed chisel head throws metal splinters'],
'صندوق كهرباء (أدوات)':['A box holding the electrical tools and leads together.','Storing electrical tools and connectors','Check the insulation of every item before use','A lead with damaged insulation in a wet place causes electrocution'],
'شنطة أدوات':['A bag with ordered pockets holding the hand tools.','Carrying a set of hand tools to the work point','Check the contents at the start of the shift\nReturn every tool to its place','Missing tools are only discovered when they are needed'],
'صندوق عدة الإطفائي':['A box holding the basic firefighter hand tools.','The essential tools a firefighter needs on the incident ground','Check it at the start of every shift','Missing items are only discovered when they are needed'],
'غطاء مجاري':['A flexible mat sealed over a drain opening to keep liquids out.','Sealing drains to stop fuel or spilled product entering the sewer','Place it before the spill reaches the drain\nSeal the edges to the ground','Fuel entering the sewer turns the incident into a spreading explosion risk'],
'مقص ومفك هيدروليك':['A hydraulic rescue tool combining cutting blades and spreading arms.','Cutting and spreading vehicle structure to free a casualty','Stabilise the vehicle and manage the glass before cutting\nDisconnect the vehicle battery if possible\nStay clear of airbag pillars\nInsert the blade square to the section','Cutting a pillar containing an undeployed airbag will fire it\nThe cut section flies off with force\nHigh-pressure oil injects through skin'],
'مفتاح براغي':['A hand wrench for loosening and tightening nuts and bolts.','Loosening and tightening nuts and bolts','Choose the exactly matching size\nPull the wrench towards you, never push','An oversize wrench rounds the nut head\nA slipping wrench injures the hand'],
'فأس صغير':['A light hand axe for small work.','Light cutting and breaking in confined spaces','Strike away from your body from a balanced stance','Striking hidden cables or pipes\nAn axe flying from the hand injures those nearby'],
'عتلة حديد':['A steel bar with a forked end multiplying hand force for lifting and prising.','Prising, lifting and forcing in tight gaps','Use a firm fulcrum\nPush with your body in a safe direction','A bar slipping under force causes falls and injuries\nA steel bar conducts electricity'],
'فأس خشب':['An axe with a broad edge for cutting timber.','Cutting timber and wooden doors','Secure the piece if possible and strike at an angle\nKeep helpers clear of the swing','Wood splinters fly when struck\nA missed swing hits the foot'],
'معدة كسر الزجاج (قلم)':['A spring-loaded punch that concentrates force on one point to shatter toughened glass.','Breaking side glass quickly with the fewest fragments','Cover the casualty first\nSet the tip on a corner of the glass and press','Toughened glass collapses completely in one go\nBreaking near the casualty head increases the injury'],
'سكين قطع الأحزمة':['A tool with a blade recessed in a narrow slot that cuts the belt without touching the body.','Cutting the seat belt to free the casualty','Support the casualty head first\nFeed the belt into the slot and pull in one movement','The blade is exposed — carry it in its sheath\nCutting near the body injures the casualty'],
'مطرقة كسر':['A heavy sledgehammer with a broad head generating high impact force.','Breaking concrete and doors and forcing entry','Keep helpers clear of the swing\nStrike with a firm grip and feet apart','Fragments fly when striking concrete — a face shield is required\nA missed swing hits a colleague'],
'منشار يدوي مع شفرة احتياط':['A hand saw with a replaceable blade.','Hand cutting where a powered saw cannot be used or where sparks are a risk','Secure the piece before cutting\nStart with short strokes then lengthen','A blade that binds and is pulled free suddenly injures the hand'],
'شنكل حديد D':['A D-shaped ring closed by a pin, joining lifting components.','Connecting ropes and chains to lifting or pulling points','Tighten the pin fully before loading\nLoad it along its axis, not sideways','A shackle without a locked pin releases under load\nSide loading greatly reduces its rating'],
'إطارات ومعدات':['Mounting frames and fittings that hold the equipment in place.','Supporting brackets and fittings for the equipment in the locker','Check they are complete at the start of the shift','One missing part puts the whole item out of service'],
'مفتاح مجاري':['A hooked key that lifts drain and manhole covers.','Lifting drain and inspection covers','Lift with a straight back and bent knees\nReplace the cover as soon as the work is finished','An open hole is a fall hazard\nCovers are very heavy and injure the foot'],
'فلتر كمامة':['A replaceable filter element fitted to the mask that traps gases and dust.','Filtering the air where oxygen is sufficient','Confirm the filter type suits the substance\nCheck the expiry date before fitting','It is useless in oxygen-deficient atmospheres — a breathing set is required\nA saturated filter passes gas without the wearer noticing'],
'منشار كهربائي':['A reciprocating electric saw for cutting metal, wood and panels.','Cutting inside buildings where a petrol engine cannot be used','Check the lead and the supply\nSecure the piece before cutting\nIsolate the power before changing the blade','A lead in water or under debris causes electrocution\nBlade kickback when it binds'],
'عصا مسك الثعبان':['A long pole with a noose or grab at the end operated from the handle.','Catching snakes and reptiles and removing them safely','Approach from a safe distance and from behind the head\nSecure the head first, then place it in the container','A bite may be venomous — call for medical aid at once\nNever handle the animal by hand'],
'خراطيم هيدروليك ملوّنة':['Reinforced colour-coded hoses distinguishing the pressure line from the return line.','Carrying oil from the pump to the tools','Match the colours when connecting\nRun the hoses out fully before starting','Wrong connection reverses the tool movement and causes injury\nA damaged hose bursts under high pressure'],
'كمامة فلتر':['A half or full mask with a replaceable filter.','Protecting the airway from dust and vapour where oxygen is sufficient','Test the seal on the face before entering\nChange the filter when breathing becomes hard','It is useless in oxygen-deficient atmospheres\nA beard breaks its seal'],
'ملحقات المخدات الهوائية':['The regulator, manifold and hoses that operate the lifting bags.','Operating the air lifting bags','Connect the regulator to the cylinder and the hoses to the bags\nSet the pressure before lifting','A coupling releasing under pressure flies violently\nA leak drops the load suddenly'],
'عادم المولد':['A pipe carrying the generator exhaust away from the working area.','Taking the generator exhaust away from the crew','Fit it before starting and point the outlet away from the crew','Exhaust releases carbon monoxide, colourless and odourless\nThe pipe reaches a very high temperature'],
'مفتاح تشغيل المضخة الغاطسة':['A waterproof control switch for the submersible pump.','Starting and stopping the submersible pump safely','Start it once the pump is submerged\nStop it before the water drops below the intake','Running dry burns the pump\nOperating without an earth leakage breaker risks electrocution'],
'عصا T أرضية':['A metal rod driven into the ground to discharge any electrical leakage.','Earthing the generator before starting it','Drive it into the ground and connect it before any load','Running without earthing exposes anyone touching the equipment to shock'],
'مضخة غاطسة كهربائية':['A pump submerged in the water that pushes it out through a hose.','Removing water from flooded basements, car parks and pits','Lower it by the rope, never by the cable\nConfirm earthing and the leakage breaker before starting\nKeep the strainer clear of silt','Electricity and water together — any damaged insulation electrocutes anyone in the water\nRunning dry burns the pump'],
'جركل بنزين':['An approved container for carrying and storing petrol.','Fuel for the saws and generator','Refuel with the engine stopped and cool\nWipe any spill at once','Petrol vapour ignites from a spark or a hot surface\nAn open can fills the locker with explosive vapour'],
'جلخ متعدد الأنواع':['A rotating tool carrying a high-speed cutting or grinding disc.','Grinding and cutting steel in confined spaces','Always fit the guard\nHold with both hands and start it clear of your body','A damaged disc explodes while spinning\nSparks ignite leaking fuel\nKickback when the disc binds'],
'نظارة واقية':['Sealed goggles that surround the eye and keep out objects and liquids.','Protecting the eyes from fragments, dust and spray','Worn before any cutting, grinding or striking','A single fragment can cost you the eye\nScratched lenses reduce vision'],
'كشاف إضاءة':['A powerful mains light illuminating the working area.','Lighting the work area at night and in dark spaces','Aim it at the work area, not into the eyes of the crew\nMount it on the stand','The front face gets hot — do not touch it after use\nA lead across the ground is a trip hazard'],
'حامل كشاف':['An extendable tripod that raises and aims the light.','Raising the light to the right height','Spread the legs fully and secure them\nDo not over-extend it in wind','An unsecured stand topples and drops the hot light'],
'صندوق كهرباء (محوّل)':['A unit converting the voltage and distributing it to the equipment.','Providing the correct voltage and distributing it on scene','Confirm the voltage matches before connecting\nKeep it clear of water','Connecting equipment to the wrong voltage burns it\nConnecting on wet ground causes electrocution'],
'بكرة كهرباء 3PH':['A reel carrying a three-phase cable for higher powered equipment.','Supplying three-phase power to heavy equipment','Run the cable out fully before loading\nCheck the phase order is correct','A coiled cable overheats and burns under load\nReversed phases reverse the motor rotation'],
'بكرة كهرباء SINGLE':['A reel carrying a single-phase cable with sockets for light tools.','Supplying single-phase power to lights and light tools','Run the cable out fully before loading','A coiled cable overheats and burns\nA cable in water electrocutes'],
'قاعدة كشاف':['A heavy base carrying the light and preventing it from toppling.','Standing the light firmly on the ground','Place it on level ground and secure it against the wind','An unstable base drops the hot light'],
'أسطوانة هواء (صفراء)':['A compressed air cylinder colour-coded for its use.','Additional air supply for the bags and pneumatic equipment','Check the pressure before use\nTransport it upright and secured','A broken valve makes the cylinder fly violently'],
'محقان بنزين':['A small hand pump transferring fuel without spillage.','Transferring fuel from the can to the equipment tank','Refuel with the engine stopped and cool\nWipe any spill at once','Fuel vapour ignites from the nearest spark'],
'مخدات هوائية 8 بار':['A reinforced rubber bag inflated with compressed air to lift a heavy load a short distance.','Lifting heavy objects to free a casualty trapped underneath','Place the bag on a flat, solid surface\nLift a little then crib immediately\nRepeat: lift a little, crib','Lifting without cribbing lets the load slip suddenly\nStacking more than two bags loses stability\nSharp edges cut the bag under pressure'],
'منظّم هواء مع ساعة':['A regulator reducing cylinder pressure to the bag working pressure, with a gauge.','Setting and reading the working pressure for the lifting bags','Set the pressure before opening the cylinder\nWatch the gauge while lifting','Exceeding the working pressure bursts the bag\nOpening the cylinder suddenly strains the regulator'],
'وصلة هواء بين أسطوانتين':['A hose with two ends connecting cylinders to transfer air between them.','Transferring air between cylinders or feeding two sets','Tighten both ends before opening the pressure\nOpen slowly and watch both gauges','Opening quickly heats both cylinders\nA leak empties the supply rapidly'],
'مفتاح منهول':['A hooked key entering the cover slot to lift manhole covers.','Lifting manhole and drainage covers','Lift with a straight back and bent knees\nReplace the cover immediately after','An open hole is a fall hazard\nCovers are very heavy and injure the foot'],
'دعاميات تثبيت':['Struts preventing a vehicle or object from moving while it is worked on.','Stabilising vehicles and objects before working on them','Stabilise both sides before starting\nRe-check after every stage','Working on an unstabilised object is a fatal risk'],
'قاذف فوم مع ساعة':['A foam branch that aerates the foam solution, with a gauge showing working pressure.','Applying foam to burning liquids and forming a vapour-sealing blanket','Set the ratio for the foam type\nLet the foam flow gently onto the surface or off the container wall\nKeep the blanket intact until the end','Applying directly onto the liquid scatters it and spreads the fire\nBreaking the blanket re-ignites the fire at once'],
'خلاط فوم خارجي':['An inline inductor drawing foam concentrate by pressure difference and mixing it with the water.','Mixing foam concentrate with water at the required ratio','Set the ratio for the foam type and the fire\nFit it in the line before the branch\nFlush the line with water afterwards','A wrong ratio makes weak foam that will not cover the surface\nFoam left in the line causes corrosion'],
'خرطوم شفط فوم':['A chemical-resistant hose drawing foam concentrate from the container.','Drawing foam concentrate from the container to the inductor','Push the end to the bottom of the container\nMake sure no air is drawn in at the joints','Air entering breaks the pick-up and produces weak foam\nConcentrate contact harms eyes and skin'],
'جراكل فوم':['Containers holding the foam concentrate before it is mixed with water.','Reserve stock of foam concentrate','Keep them closed and out of the sun\nCheck the expiry date','Concentrate contact harms eyes and skin\nMixing different foam types spoils the solution'],
'مقسم (3) رؤوس':['A dividing breeching with one inlet and three outlets, each with its own valve.','Splitting one supply line into three working lines','Set it on the ground near the crews\nClose the valves before calling for water and open each gradually','Opening all lines together drops the pressure for everyone\nAn unsecured breeching jumps when pressure rises'],
'دعاميات تثبيت السيارة':['Struts placed under the vehicle to stop it moving during the rescue.','Stabilising the crashed vehicle before the rescue starts','Stabilise before anyone enters the vehicle\nRe-check after every cutting stage','An unstabilised vehicle moves suddenly onto the casualty or the crew'],
'خرطوم حريق إرسال كبير':['A large diameter supply hose for moving large volumes of water.','Moving large volumes of water from the source to the pump or between appliances','Run out by two firefighters\nSecure the couplings before raising pressure','Its reaction and weight cause back injuries\nA loose coupling separates under pressure'],
'قاذف ماء 101':['An adjustable branch controlling the flow and the shape of the water.','Controlling water shape: spray for protection, straight jet for penetration','Start in the spray position\nOpen slowly and close slowly','Sudden opening causes water hammer\nA straight jet on a live circuit conducts the shock'],
'مرشّح تصفية':['A filter screen holding back debris before it enters the water system.','Filtering the water entering the pump or the tank','Fit it at the filling inlet\nClean it when the flow weakens','A blocked filter cuts the supply for no obvious reason\nWorking without it damages the pump'],
'مفتاح ماسورة الهايدرنت':['A key made for fitting and tightening the hydrant standpipe.','Fitting and removing the hydrant standpipe','Set it on the standpipe head and turn steadily','A sudden pull breaks the standpipe head'],
'مفتاح شد':['A metal spanner with two jaws gripping the coupling lug to tighten or release it.','Tightening and releasing hose couplings','Set the jaws on the coupling lug and tighten fully','Never release a coupling before the line pressure is zero\nA slipping spanner injures the hand'],
'مصفاة شفط':['A metal strainer on the suction hose end holding back debris.','Preventing dirt and gravel entering the pump while draughting','Fit it on the suction hose end before submerging\nKeep it clear of the bottom\nClean it after use','Draughting without a strainer damages the pump impeller\nA blocked strainer cuts the supply gradually'],
'مقسم (3) رؤوس مع فالف':['A dividing breeching with independent valves on each outlet.','Splitting the supply line into three controlled lines','Close the valves before calling for water and open gradually\nSecure it on the ground','Opening all lines together drops the pressure\nAn unsecured breeching jumps'],
'وصلة ماء':['An adaptor joining two different coupling sizes in water lines.','Connecting couplings of different sizes','Confirm both sizes before fitting\nCheck for leaks after opening the water','A loose connection separates under pressure'],
'وصلة أنثى نظام بريطاني':['A female coupling of British Standard size for connecting to older networks.','Connecting to hoses or supplies using the British system','Confirm the system matches before fitting and tighten fully','A loose connection separates under pressure and strikes those nearby'],
'مقسم (3) رؤوس مع ولف تحكم':['A dividing breeching with fine control valves on each outlet.','Splitting the line with fine control of each outlet flow','Close before calling for water and open gradually for each crew','Wrong control cuts the water from a crew working inside the building'],
'مفاتيح السلم للطوارئ':['Special keys operating the aerial ladder emergency system.','Operating or lowering the ladder manually if the powered system fails','Follow the approved ladder emergency procedure\nClear the area under the ladder','Uncontrolled manual lowering drops the ladder dangerously fast'],
'جامع رؤوس':['A collecting head with several inlets meeting one outlet to increase the incoming water.','Combining several supply lines into one pump inlet','Fit it on the supply inlet and tighten the couplings\nCheck the non-return valves work','A leaking connection cuts the supply suddenly during the operation'],
'حبل خراطيم':['A short rope with a hook used to hoist and secure hose lines.','Hoisting hose to upper floors and securing it to a ladder or window','Tie the hose with the approved knot before hoisting\nWarn those below before raising or lowering','A hoisted hose that falls injures those below\nA wrong knot slips under the weight'],
'ريموت السلم':['A control unit driving the aerial ladder up, round and out.','Controlling the ladder movement from the ground','Deploy the outriggers and stabilise the vehicle before raising\nWatch overhead lines and obstacles throughout','Ladder contact with power lines electrifies the whole appliance\nMoving without outriggers overturns the vehicle'],
'وصلة (ماسورة) فوم 102':['A connector made for foam lines.','Connecting the foam line to the branch or inductor','Tighten the connection before operating\nFlush the line after use','A leak cuts the foam supply mid-operation'],
'أحزمة خراطيم':['Straps with buckles that secure a hose roll and make it easy to carry.','Carrying and securing hose rolls while moving and climbing','Wrap and tighten the strap before lifting','A loose strap slips and drops the roll on the foot'],
'خرطوم تعبئة الخزان':['A short hose connecting the water source to the appliance tank inlet.','Filling the appliance tank from a hydrant or another appliance','Tighten the connection at the tank inlet\nWatch the level while filling','Filling at high pressure damages the tank\nUnattended filling overflows'],
'وصلة فوم':['A fitting inserted in the line to introduce foam concentrate into the water.','Converting a water line into a foam line','Fit it in the line and confirm foam supply before applying\nFlush after use','Foam left in the line causes corrosion and blockage'],
'جركل فوم':['A container holding foam concentrate.','Reserve stock of foam concentrate','Keep it closed and out of the sun and check the expiry date','Concentrate contact harms eyes and skin'],
'صابون سائل':['A cleaning liquid used to wash equipment and hands.','Washing equipment and hands after the incident','Wash contaminated equipment before returning it to the locker','Returning contaminated equipment spreads the contamination to the rest'],
'مفتاح خرطوم الإسعاف':['A small spanner sized for the hose reel coupling.','Tightening and releasing the hose reel couplings','Set it on the coupling lug and tighten fully\nNever release before the pressure is zero','A spanner slipping under pressure injures the hand'],
'جهاز تحكم الإضاءة (ريموت)':['A control unit operating the appliance lights and the light mast electrically.','Controlling the appliance lights and the light mast from the pump panel','Aim the lighting at the work area, not at passing drivers\nLower the mast before moving off','Driving with the mast raised strikes cables and bridges\nAiming light at traffic blinds drivers'],

function silhouette(v){
  const id = v.id;
  const W = 460, H = 200;
  const x0 = 26, x1 = W - 26, bodyTop = 62, bodyBot = 150;
  const twoCab = v.compartments.filter(c=>c.kind==='cab').length > 1;
  const cabW = twoCab ? 168 : 118;
  let s = `<svg class="elev" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(v.name))}">
    <defs>
      <linearGradient id="sb${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#EDEF4B"/><stop offset=".55" stop-color="#DCDE22"/><stop offset="1" stop-color="#BFC114"/>
      </linearGradient>
      <pattern id="sc${id}" width="26" height="10" patternUnits="userSpaceOnUse">
        <rect width="26" height="10" fill="#D8232A"/><rect x="13" width="13" height="10" fill="#EDEF4B"/>
      </pattern>
      <linearGradient id="sg${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#93A3AC"/><stop offset="1" stop-color="#41525C"/>
      </linearGradient>
    </defs>`;
  // ظل أرضي
  s += `<ellipse cx="${W/2}" cy="${H-24}" rx="${(x1-x0)/2}" ry="7" fill="rgba(0,0,0,.14)"/>`;
  // الهيكل
  s += `<rect x="${x0}" y="${bodyTop}" width="${x1-x0}" height="${bodyBot-bodyTop}" rx="10" fill="url(#sb${id})"/>`;
  // معدات السقف حسب السيارة
  if(id==='ladder')
    s += `<rect x="${x0+cabW}" y="${bodyTop-20}" width="${x1-x0-cabW-10}" height="13" rx="4" fill="#C7CFD4"/>
          <rect x="${x0+cabW+6}" y="${bodyTop-16}" width="${x1-x0-cabW-26}" height="5" rx="2" fill="#7E888E"/>
          <circle cx="${x1-34}" cy="${bodyTop-13}" r="8" fill="#F3C13A"/>`;
  else if(id==='sky')
    s += `<rect x="${x0+cabW+16}" y="${bodyTop-16}" width="${x1-x0-cabW-56}" height="10" rx="4" fill="#B9C1C6"/>
          <circle cx="${x1-52}" cy="${bodyTop-11}" r="7" fill="#F3C13A"/>`;
  else if(id==='arff')
    s += `<rect x="${x0+cabW+26}" y="${bodyTop-14}" width="${x1-x0-cabW-70}" height="8" rx="3" fill="#C7CFD4"/>
          <circle cx="${x0+cabW+22}" cy="${bodyTop-10}" r="6" fill="#F3C13A"/>`;
  else if(id==='tanker' || id==='at')
    s += `<rect x="${x0+cabW+30}" y="${bodyTop-12}" width="34" height="8" rx="3" fill="#C7CFD4"/>
          <circle cx="${x0+cabW+26}" cy="${bodyTop-8}" r="6" fill="#F3C13A"/>`;
  // شريط الإنذار
  s += `<rect x="${x0+14}" y="${bodyTop-11}" width="${cabW-28}" height="9" rx="3" fill="#2B2320"/>
        <rect x="${x0+18}" y="${bodyTop-9}" width="${(cabW-36)/2}" height="5" rx="2" fill="#FF4046"/>
        <rect x="${x0+18+(cabW-36)/2}" y="${bodyTop-9}" width="${(cabW-36)/2}" height="5" rx="2" fill="#F3C13A"/>`;
  // الزجاج
  s += `<rect x="${x0+9}" y="${bodyTop+10}" width="${twoCab?68:64}" height="34" rx="6" fill="url(#sg${id})"/>`;
  if(twoCab) s += `<rect x="${x0+85}" y="${bodyTop+10}" width="${cabW-94}" height="34" rx="6" fill="url(#sg${id})"/>`;
  // فاصل الكابينة عن الصندوق
  s += `<rect x="${x0+cabW}" y="${bodyTop+4}" width="2.5" height="${bodyBot-bodyTop-14}" rx="1" fill="rgba(0,0,0,.28)"/>`;
  // الشريط العاكس الأحمر المتقطّع والقاعدة البيضاء
  s += `<rect x="${x0}" y="${bodyBot-20}" width="${x1-x0}" height="10" fill="url(#sc${id})" opacity=".95"/>`;
  s += `<rect x="${x0}" y="${bodyBot-10}" width="${x1-x0}" height="10" rx="4" fill="#F7F7F2"/>`;

  // العجلات
  const wy = bodyBot + 6;
  const ws = [x0+52, x1-52];
  if((x1-x0) > 380) ws.push(x1-108);
  ws.forEach(wx => { s += `<circle cx="${wx}" cy="${wy}" r="21" fill="#1A1512"/>
    <circle cx="${wx}" cy="${wy}" r="10" fill="#4A413A"/><circle cx="${wx}" cy="${wy}" r="4" fill="#7C6F64"/>`; });
  return s + `</svg>`;
}

const SIDE_BAY_LAYOUTS = {
  rescue: {يسار:[1,3], يمين:[2,4]},
  sky:    {يسار:[1,3], يمين:[2,4]}
};
function sideBays(v,side){
  const bays = v.compartments.filter(c=>c.kind==='bay' && (c.side||'يمين')===side);
  const order = (SIDE_BAY_LAYOUTS[v.id] || {})[side];
  return order ? order.map(no=>bays.find(c=>Number(c.no)===no)).filter(Boolean)
               : bays.sort((a,b)=>Number(a.no)-Number(b.no));
}
function elevation(v,{side='يمين', activeId=null, all=false}={}){
  const cabs = v.compartments.filter(c=>c.kind==='cab');
  const bays = all ? v.compartments.filter(c=>c.kind==='bay')
                   : sideBays(v,side);
  const flip = !all && side==='يسار';          // من الجهة اليسرى تكون المقدمة إلى اليمين
  const uidg = v.id + (all?'A':(flip?'R':'L'));
  const BW = 78, GAP = 7, PAD = 14;
  const cabW = cabs.length>1 ? 200 : 122;
  const bodyW = Math.max(cabW + 10 + bays.length*(BW+GAP), cabW + 120);
  const W = bodyW + PAD*2, H = 196;
  const x0 = PAD, bodyTop = 34, bodyBot = 148;
  const X = (x,w=0) => flip ? (W - x - w) : x;   // مرآة الإحداثيات

  let s = `<svg class="elev" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(v.name))}">
  <defs>
    <linearGradient id="bd${uidg}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEF4B"/><stop offset=".55" stop-color="#DCDE22"/><stop offset="1" stop-color="#BFC114"/>
    </linearGradient>
    <pattern id="cv${uidg}" width="24" height="9" patternUnits="userSpaceOnUse">
      <rect width="24" height="9" fill="#D8232A"/><rect x="12" width="12" height="9" fill="#EDEF4B"/>
    </pattern>
    <linearGradient id="gl${uidg}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5b63"/><stop offset="1" stop-color="#1d262b"/>
    </linearGradient>
    <linearGradient id="sg${uidg}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ccd1"/><stop offset="1" stop-color="#7d878d"/>
    </linearGradient>
    <pattern id="rib${uidg}" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="url(#sg${uidg})"/><rect y="4" width="6" height="2" fill="rgba(0,0,0,.28)"/>
    </pattern>
  </defs>`;
  s += `<rect x="0" y="${H-16}" width="${W}" height="1.5" fill="#2b231d"/>`;
  s += `<rect x="${X(x0,bodyW)}" y="${bodyTop}" width="${bodyW}" height="${bodyBot-bodyTop}" rx="9" fill="url(#bd${uidg})"/>`;

  // معدات السقف حسب نوع السيارة
  if(v.id==='ladder'){
    s += `<rect x="${X(x0+cabW,bodyW-cabW-6)}" y="${bodyTop-16}" width="${bodyW-cabW-6}" height="11" rx="3" fill="#cfd6da"/>
          <rect x="${X(x0+cabW+4,bodyW-cabW-14)}" y="${bodyTop-13}" width="${bodyW-cabW-14}" height="5" rx="2" fill="#8b949a"/>
          <circle cx="${X(x0+bodyW-24)}" cy="${bodyTop-10}" r="7" fill="#FFC000"/>`;
  } else if(v.id==='sky'){
    s += `<rect x="${X(x0+cabW+14,bodyW-cabW-40)}" y="${bodyTop-13}" width="${bodyW-cabW-40}" height="9" rx="3" fill="#b9c1c6"/>`;
  } else if(v.id==='arff'){
    s += `<rect x="${X(x0+cabW+20,bodyW-cabW-52)}" y="${bodyTop-12}" width="${bodyW-cabW-52}" height="7" rx="3" fill="#cfd6da"/>
          <circle cx="${X(x0+cabW+18)}" cy="${bodyTop-9}" r="5" fill="#FFC000"/>`;
  }
  // شريط الإنارة
  s += `<rect x="${X(x0+16,cabW-32)}" y="${bodyTop-9}" width="${cabW-32}" height="8" rx="3" fill="#2a2320"/>
        <rect x="${X(x0+20,(cabW-40)/2)}" y="${bodyTop-7}" width="${(cabW-40)/2}" height="4" rx="2" fill="#FF4046"/>
        <rect x="${X(x0+20+(cabW-40)/2,(cabW-40)/2)}" y="${bodyTop-7}" width="${(cabW-40)/2}" height="4" rx="2" fill="#FFC000"/>`;

  // الكابينات
  cabs.forEach((c,i)=>{
    const cx = i===0 ? x0+9 : x0+87;
    const cw = i===0 ? (cabs.length>1?70:66) : cabW-96;
    const on = activeId===c.id;
    s += `<g class="bay ${on?'open':''}" data-c="${c.id}" tabindex="0" role="button" aria-label="${esc(t(c.name))}">

      <text class="cablbl" x="${X(cx+cw/2)}" y="${bodyTop+34}" text-anchor="middle">${i===0?'CAB':'CREW'}</text>
    </g>`;
  });
  // الشريط العاكس + الشيفرون الخلفي
  s += `<rect x="${X(x0,bodyW)}" y="${bodyBot-16}" width="${bodyW}" height="9" fill="url(#cv${uidg})" opacity=".95"/>`;


  // الخانات
  bays.forEach((c,i)=>{
    const bx = x0 + cabW + 10 + i*(BW+GAP);
    const by = bodyTop + 14, bh = 74;
    const on = activeId===c.id;
    s += `<g class="bay ${on?'open':''}" data-c="${c.id}" tabindex="0" role="button" aria-label="${esc(t(c.name))}">
      <rect class="cavity" x="${X(bx,BW)}" y="${by}" width="${BW}" height="${bh}" rx="4"/>
      <rect class="shutter" x="${X(bx+2,BW-4)}" y="${by+2}" width="${BW-4}" height="${bh-4}" rx="3" fill="url(#rib${uidg})"/>
      <text class="baylbl" x="${X(bx+BW/2)}" y="${by+22}" text-anchor="middle">${c.no}</text>
      <rect class="frame" x="${X(bx,BW)}" y="${by}" width="${BW}" height="${bh}" rx="4"/>
    </g>`;
  });
  // العجلات
  const wy = bodyBot + 4;
  const ws = [x0+52, x0+bodyW-52];
  if(bodyW>430) ws.push(x0+bodyW-104);
  ws.forEach(wx=>{ const c = X(wx);
    s += `<circle cx="${c}" cy="${wy}" r="22" fill="#15110f"/><circle cx="${c}" cy="${wy}" r="11" fill="#3b332d"/><circle cx="${c}" cy="${wy}" r="4" fill="#6b5f55"/>`; });
  s += `</svg>`;
  return s;
}

function viewItem(vid,cid,iid){
  const v = findV(vid), c = findC(v,cid);
  const it = c && c.items.find(x=>x.id===iid);
  if(!it) return viewFleet();
  const row = (label, val, kind) => {
    const L = lines(t(val)); if(!L.length) return '';
    let inner;
    if(kind==='steps') inner = `<ol class="steps">${L.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol>`;
    else if(kind==='specs') inner = `<div class="specs" style="margin:0">${L.map(x=>{
        const i2 = x.indexOf(':'); const k = i2>0?x.slice(0,i2).trim():x; const val2 = i2>0?x.slice(i2+1).trim():'—';
        return `<div class="spec" style="box-shadow:none"><b>${esc(k)}</b><i>${esc(val2)}</i></div>`;}).join('')}</div>`;
    else inner = L.length===1 ? `<p style="margin:0">${esc(L[0])}</p>` : `<ul>${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    return `<div class="row ${kind==='danger'?'danger':''}"><span class="lab">${label}</span><span class="val">${inner}</span></div>`;
  };
  const im = IMGS[it.id];
  const idx = c.items.findIndex(x=>x.id===iid);
  const prev = idx>0 ? c.items[idx-1] : null;
  const next = idx < c.items.length-1 ? c.items[idx+1] : null;

  let h = `<div class="hero">
    ${im?`<div class="shot"><img src="${im}" alt="${esc(t(it.name))}" loading="lazy"></div>`
        :`<div class="noshot">${itemIcon(it.cat)}</div>`}
    <div class="in">
      ${it.cat?`<span class="chip">${esc(catT(it.cat))}</span>`:''}
      <h1>${esc(t(it.name))}</h1>
      <div class="en">${esc(lang?it.name.ar:(it.name.en||''))}</div>
    </div></div>
  <p class="crumb">${esc(t(v.name))} › ${esc(t(c.name))}</p>
  <div class="row"><span class="lab">${T('nameLbl')}</span><span class="val"><p style="margin:0">${esc(t(it.name))}</p></span></div>`;
  h += row(T('defT'), it.def, '');
  h += row(T('usesLbl'), it.uses, '');
  h += row(T('howLbl'), it.howto, 'steps');
  h += row(T('hazLbl'), it.hazards, 'danger');
  h += row(T('techLbl'), it.tech, 'specs');
  h += row(T('notesLbl'), it.notes, '');
  h += `<div class="navbar">
    <button ${prev?`onclick="go('#/e/${vid}/${cid}/${prev.id}')"`:'disabled'}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg>${T('prev')}</button>
    <button ${next?`onclick="go('#/e/${vid}/${cid}/${next.id}')"`:'disabled'}>${T('next')}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
  </div>`;
  if(admin && editMode){
    h += `<div class="actions">
      <button class="btn p" onclick="editItem('${vid}','${cid}','${iid}')">${T('editItem')}</button>
      <button class="btn d" onclick="delItem('${vid}','${cid}','${iid}')">${T('del')}</button>
    </div>`;
  }
  return h;
}

let q = '';
function viewSearch(){
  let h = `<div class="eyebrow">${T('searchT')}</div>

function renderResults(){
  const box = $('#res'); if(!box) return;
  const s = q.trim().toLowerCase();
  if(!s){ box.innerHTML = `<div class="empty"><b>${lang?'Type to search':'اكتب للبحث'}</b>${lang?'Equipment, compartments and appliances.':'المعدات والخانات والسيارات.'}</div>`; return; }
  let out = '', n = 0;
  DB.vehicles.forEach(v=>{
    if((t(v.name)+v.code).toLowerCase().includes(s)){
      n++; out += `<button class="sitem" onclick="go('#/v/${v.id}')"><span class="dot"></span>
        <span class="t"><b>${esc(t(v.name))}</b><span>${esc(v.code)} · ${lang?'appliance':'سيارة'}</span></span></button>`;
    }
    v.compartments.forEach(c=>{
      c.items.forEach(it=>{
        const hay = (it.name.ar+' '+it.name.en+' '+it.cat+' '+it.uses.ar).toLowerCase();
        if(hay.includes(s)){
          n++; out += `<button class="sitem" onclick="go('#/e/${v.id}/${c.id}/${it.id}')"><span class="dot"></span>
            <span class="t"><b>${esc(t(it.name))}</b><span>${esc(t(v.name))} · ${esc(t(c.name))}</span></span></button>`;
        }
      });
    });
  });
  box.innerHTML = n ? out : `<div class="empty"><b>${T('noRes')}</b>${T('noResS')}</div>`;
}

  const p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} · ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- التدريب العشوائي ---------- */
const TRAIN_CATS = ['هيدروليك','تنفس','رفع ودعم','رفع وسحب','قطع ونشر','مصادر ماء','خراطيم','فوم',
  'طفايات','إنقاذ','سلالم','تهوية','كهرباء','هواء مضغوط','قياس','حبال','مواد خطرة','تدخلات خاصة','إطفاء'];
let drill = null;   // {a,b,type,trainer,count,date,notes,png}

function candidates(){
  const out = [];
  DB.vehicles.forEach(v=>v.compartments.forEach(c=>c.items.forEach(it=>{
    const hasHow = lines(it.howto && it.howto.ar).length >= 2;
    if(hasHow && TRAIN_CATS.includes(it.cat)) out.push({v,c,it});
  })));
  return out;
}
function pickDrill(){
  const list = candidates();
  if(list.length < 2){ toast(T('noCands')); return; }
  let i = Math.floor(Math.random()*list.length), j = i;
  let guard = 0;
  while((j===i || list[j].it.name.ar===list[i].it.name.ar) && guard++ < 60) j = Math.floor(Math.random()*list.length);
  const keep = drill || {};
  drill = {a:list[i], b:list[j], type:keep.type||0, trainer:keep.trainer||(admin?ADMIN_NAME:''),
           count:keep.count||'', date:keep.date||new Date().toISOString().slice(0,10), notes:keep.notes||'', png:null};
  render();
}

/* رسم التقرير على canvas */
function loadLogo(){
  return new Promise(res=>{
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = './logo.png';
  });
}
async function makeReport(){
  if(!drill) return;
  ['d_trainer','d_count','d_notes','d_date'].forEach(id=>{
    const e = document.getElementById(id); if(!e) return;
    if(id==='d_trainer') drill.trainer = e.value;
    if(id==='d_count') drill.count = e.value;
    if(id==='d_notes') drill.notes = e.value;
    if(id==='d_date') drill.date = e.value;
  });
  const sel = document.getElementById('d_type'); if(sel) drill.type = sel.selectedIndex;

  const W = 1080, H = 1500;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.direction = 'rtl'; x.textAlign = 'right';
  const F = (w,sz)=>`${w} ${sz}px "IBM Plex Sans Arabic","Noto Kufi Arabic",system-ui,sans-serif`;

  x.fillStyle = '#ffffff'; x.fillRect(0,0,W,H);
  // شريط الشيفرون
  for(let i=-60;i<W+60;i+=44){
    x.fillStyle = '#D8232A'; x.beginPath(); x.moveTo(i,0); x.lineTo(i+22,0); x.lineTo(i+22-18,16); x.lineTo(i-18,16); x.closePath(); x.fill();
    x.fillStyle = '#FFC000'; x.beginPath(); x.moveTo(i+22,0); x.lineTo(i+44,0); x.lineTo(i+44-18,16); x.lineTo(i+22-18,16); x.closePath(); x.fill();
  }
  const logo = await loadLogo();
  if(logo) x.drawImage(logo, W/2-72, 44, 144, 144);

  x.textAlign = 'center';
  x.fillStyle = '#14100E'; x.font = F(700,34);
  x.fillText('الإدارة العامة للدفاع المدني', W/2, 232);
  x.fillStyle = '#8A7C70'; x.font = F(500,22);
  x.fillText('وزارة الداخلية · دولة قطر', W/2, 268);
  x.fillStyle = '#D8232A'; x.font = F(700,42);
  x.fillText('تقرير تدريب على المعدات', W/2, 336);

  x.strokeStyle = '#E4DCD3'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(70,372); x.lineTo(W-70,372); x.stroke();

  x.textAlign = 'right';
  let y = 430;
  const row = (k,v)=>{
    x.fillStyle = '#8A7C70'; x.font = F(500,24); x.fillText(k, W-70, y);
    x.fillStyle = '#14100E'; x.font = F(600,30); x.fillText(v||'—', W-260, y);
    x.strokeStyle = '#F0EAE3'; x.beginPath(); x.moveTo(70,y+22); x.lineTo(W-70,y+22); x.stroke();
    y += 66;
  };
  row('التاريخ', drill.date);
  row('نوع التدريب', UI.types[0][drill.type]||'—');
  row('المدرّب', drill.trainer);
  row('عدد المتدربين', drill.count);

  y += 18;
  x.fillStyle = '#D8232A'; x.font = F(700,30);
  x.fillText('المعدتان المختارتان', W-70, y); y += 26;

  const box = (n, it, v, c) => {
    const bh = 168;
    x.fillStyle = '#FAF6F1'; x.strokeStyle = '#E4DCD3';
    x.beginPath(); x.roundRect(70, y, W-140, bh, 16); x.fill(); x.stroke();
    x.fillStyle = '#FFC000';
    x.beginPath(); x.roundRect(W-140, y+22, 52, 52, 12); x.fill();
    x.textAlign = 'center'; x.fillStyle = '#1A1206'; x.font = F(700,28);
    x.fillText(String(n), W-114, y+58);
    x.textAlign = 'right';
    x.fillStyle = '#14100E'; x.font = F(700,34);
    x.fillText(it, W-160, y+56);
    x.fillStyle = '#6D6055'; x.font = F(500,24);
    x.fillText(v, W-160, y+98);
    x.fillStyle = '#8A7C70'; x.font = F(500,22);
    x.fillText(c, W-160, y+136);
    y += bh + 18;
  };
  box(1, t(drill.a.it.name), t(drill.a.v.name), t(drill.a.c.name));
  box(2, t(drill.b.it.name), t(drill.b.v.name), t(drill.b.c.name));

  if(drill.notes){
    y += 10;
    x.fillStyle = '#8A7C70'; x.font = F(500,24); x.fillText('ملاحظات', W-70, y); y += 36;
    x.fillStyle = '#14100E'; x.font = F(500,26);
    const words = String(drill.notes).replace(/\n/g,' ').split(' ');
    let line = '';
    words.forEach(w=>{
      const test = line ? line+' '+w : w;
      if(x.measureText(test).width > W-160){ x.fillText(line, W-70, y); y += 38; line = w; }
      else line = test;
    });
    if(line) x.fillText(line, W-70, y);
  }

  // تذييل
  x.fillStyle = '#14100E'; x.fillRect(0,H-96,W,96);
  x.textAlign = 'center'; x.fillStyle = '#F2EBE3'; x.font = F(600,24);
  x.fillText('تطبيق أسطول الدفاع المدني — مرجع تدريبي', W/2, H-52);
  x.fillStyle = '#A8988B'; x.font = F(500,20);
  x.fillText('يُعتمد دائمًا دليل الشركة المصنّعة والتعليمات الرسمية', W/2, H-22);

  drill.png = cv.toDataURL('image/png');
  if(!DB.trainings) DB.trainings = [];
  DB.trainings.push({id:uid('t'), at:Date.now(), date:drill.date, type:UI.types[0][drill.type]||'',
    a:t(drill.a.it.name), b:t(drill.b.it.name), trainer:drill.trainer, count:drill.count});
  await save();
  render();
  setTimeout(()=>{ const im = document.querySelector('.rep'); if(im) im.scrollIntoView({behavior:'smooth',block:'center'}); }, 120);
}
function reportName(){ return 'تقرير-تدريب-'+(drill&&drill.date||'').replace(/-/g,'')+'.png'; }
function dataURLtoFile(){
  const b = atob(drill.png.split(',')[1]);
  const u = new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i);
  return new File([u], reportName(), {type:'image/png'});
}
function reportText(){
  return 'تقرير تدريب على المعدات\n'
    + 'التاريخ: ' + drill.date + '\n'
    + 'نوع التدريب: ' + (UI.types[0][drill.type]||'') + '\n'
    + 'المعدة 1: ' + t(drill.a.it.name) + ' — ' + t(drill.a.v.name) + '\n'
    + 'المعدة 2: ' + t(drill.b.it.name) + ' — ' + t(drill.b.v.name)
    + (drill.trainer ? '\nالمدرّب: ' + drill.trainer : '');
}
async function shareReport(){
  if(!drill || !drill.png) return;
  try{
    const f = dataURLtoFile();
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], text:reportText()});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  downloadReport();
  window.open('https://wa.me/?text='+encodeURIComponent(reportText()), '_blank');
  toast(lang?'Image saved — attach it in WhatsApp.':'حُفظت الصورة — أرفقها في واتساب.');
}
function downloadReport(){
  if(!drill || !drill.png) return;
  const a = document.createElement('a');
  a.href = drill.png; a.download = reportName(); a.click();
}
function printReport(){
  if(!drill || !drill.png) return;
  const w = window.open('', '_blank');
  if(!w){ toast(lang?'Allow pop-ups to print.':'اسمح بالنوافذ المنبثقة للطباعة.'); return; }
  w.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>'
    + reportName() + '</title><style>@page{margin:0}body{margin:0}img{width:100%;display:block}</style></head><body><img src="'
    + drill.png + '"></body></html>');
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 400);
}

let scrollMem = {};
let lastHash = location.hash || '#/';
window.addEventListener('scroll', ()=>{ scrollMem[location.hash||'#/'] = window.scrollY; }, {passive:true});
function goBack(){ history.back(); }
function topTitle(p){
  if(p[0]==='v'){ const v = findV(p[1]); return v ? t(v.name) : T('acadT'); }
  if(p[0]==='e' || p[0]==='c'){ const v = findV(p[1]); const c = v && findC(v,p[2]);
    return c ? t(c.name) : (lang?'Equipment':'المعدة'); }
  if(p[0]==='search') return T('tabSearch');
  if(p[0]==='notices') return T('tabNotices');
  if(p[0]==='account') return T('tabAcct');
  if(p[0]==='train') return T('trainRow');
  return T('acadT');
}
function render(){
  const p = (location.hash||'#/').slice(2).split('/').filter(Boolean);
  const app = $('#app');
  $('#topTitle').textContent = topTitle(p);
  $('#topBack').classList.toggle('hide', !(p[0]==='v' || p[0]==='e' || p[0]==='c' || p[0]==='train'));
  if(p[0]==='v') app.innerHTML = viewVehicle(p[1]);
  else if(p[0]==='e') app.innerHTML = viewItem(p[1],p[2],p[3]);
  else if(p[0]==='search'){ app.innerHTML = viewSearch(); renderResults(); setTimeout(()=>$('#q')&&$('#q').focus(),60); }
  else if(p[0]==='c') app.innerHTML = viewComp(p[1],p[2]);
  else if(p[0]==='notices'){ app.innerHTML = viewNotices(); markAllRead(); }
  else if(p[0]==='account') app.innerHTML = viewAccount();
  else if(p[0]==='train') app.innerHTML = viewTrain();
  else app.innerHTML = viewFleet();
  app.classList.toggle('withnav', p[0]==='e');
  const tab = p[0]==='search'?'search':(p[0]==='notices'?'notices':((p[0]==='account'||p[0]==='train')?'account':'fleet'));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  updateBadge();
  document.querySelectorAll('.elev .bay').forEach(g=>{
    const id = g.dataset.c;
    const act = e => { e.stopPropagation(); const vid = (location.hash||'').split('/')[2]; if(vid) toggleComp(vid,id); };
    g.addEventListener('click',act);
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') act(e); });
  });
  $('#fab').classList.toggle('on', admin && editMode && (p[0]==='v' || p[0]==='c'));
  $('#editBadge').classList.toggle('on', admin && editMode);
  const memY = scrollMem[location.hash||'#/'];
  requestAnimationFrame(()=>window.scrollTo({top: memY || 0, behavior:'instant'}));
}
window.addEventListener('hashchange',()=>{
  const h = location.hash || '#/';
  const vidOf = x => { const q = x.slice(2).split('/').filter(Boolean); return (q[0]==='v'||q[0]==='e'||q[0]==='c') ? q[1] : null; };
  const from = vidOf(lastHash), to = vidOf(h);
  if(!to || (from && to && from!==to)) openComp = null;
  lastHash = h;

                                                   : 'هذا البريد غير مصرّح له بالدخول.';

    return lang ? 'The service is unavailable right now. Please try again shortly.'

function shrinkImage(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const MAX = 1000;
        const k = Math.min(1, MAX/Math.max(im.width,im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.72));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
