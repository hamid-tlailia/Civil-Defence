<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A81B2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>أسطول الدفاع المدني — قطر</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#A81B2D; --red2:#C4213A; --red-dk:#8A1224;
  --gold:#F3C13A; --gold-dk:#E3A81C; --gold-soft:#FDF3D6;
  --ink:#1F1A16; --body-c:#3B342E; --muted:#7C6F64;
  --bg:#F4F1EB; --card:#FFFFFF; --line:#E7DFD4; --line2:#F0EAE1;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:16px;
  --sh:0 2px 10px rgba(60,40,20,.07);
  --sh2:0 6px 22px rgba(60,40,20,.12);
  --chevron:repeating-linear-gradient(115deg,var(--red) 0 20px,#fff 20px 22px,var(--gold) 22px 42px,#fff 42px 44px);
  --shutter:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 3px,rgba(0,0,0,.30) 3px 7px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--body-c);font-family:var(--body);font-size:15px;line-height:1.7;
  overflow-x:hidden;min-height:100dvh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{max-width:760px;margin:0 auto;padding:18px 14px 120px}

/* ===== الشريط العلوي ===== */
.top{position:sticky;top:0;z-index:60}
.top .band{height:5px;background:var(--chevron)}
.topin{max-width:760px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;
  border-radius:0 0 18px 18px;box-shadow:0 4px 16px rgba(168,27,45,.28)}
.ttl{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.16);color:#fff;
  display:grid;place-items:center;flex:none;transition:.16s}
.tbtn:active{transform:scale(.92)}
.tbtn svg{width:18px;height:18px}
.tbtn.lang{width:auto;padding:0 12px;font-family:var(--mono);font-size:12px;font-weight:600}
.tbtn.hide{display:none}
html[dir="rtl"] .tbtn.bk svg{transform:scaleX(-1)}

/* ===== عناوين ===== */
.eyebrow{font-family:var(--display);font-size:14px;font-weight:700;color:var(--red);
  display:flex;align-items:center;gap:9px;margin:22px 0 10px}
.eyebrow::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--line),transparent)}
h1{font-family:var(--display);font-weight:900;font-size:23px;line-height:1.3;margin:0 0 6px;color:var(--ink)}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 8px;color:var(--ink)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}

/* ===== شعار الرئيسية ===== */
.crest{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);
  padding:22px 16px 18px;text-align:center;margin:16px 0 6px}
.crest .badge{width:132px;height:132px;margin:0 auto 4px;display:grid;place-items:center;
  border-radius:34px;background:#fff;border:9px solid rgba(168,27,45,.22);box-shadow:var(--sh)}
.crest img{width:96px;height:96px;object-fit:contain}
html[data-theme="dark"] .crest .badge{background:#F7F3ED;border-color:rgba(201,41,58,.30)}
.crest svg{width:96px;height:96px}
.crest b{display:block;font-family:var(--display);font-weight:900;font-size:18px;color:var(--ink);margin-top:12px}
.crest span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;direction:ltr}
.crest .rule{width:70px;height:4px;border-radius:3px;background:var(--gold);margin:13px auto 0}

/* ===== شبكة السيارات ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:var(--sh);transition:.16s;text-align:start}
.vcard:active{transform:scale(.98)}
.vcard .pic{background:linear-gradient(180deg,#fbf8f3,#f1ebe2);padding:6px 4px 0;border-bottom:1px solid var(--line2)}
.vcard .lbl{background:var(--gold);padding:8px 10px 9px;text-align:center}
.vcard .lbl b{display:block;font-family:var(--display);font-weight:700;font-size:13.5px;color:#3a2c05;line-height:1.35}
.vcard .lbl span{display:block;font-size:11px;color:#6b5410;margin-top:2px}

/* ===== أشرطة اختيار الخانة ===== */
.bays{background:linear-gradient(180deg,var(--red2),var(--red));border-radius:16px;padding:11px;margin-bottom:12px;
  box-shadow:var(--sh)}
.bayrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.bayrow.top{margin-bottom:7px}
.bchip{min-width:52px;height:34px;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;
  font-family:var(--mono);font-size:11.5px;font-weight:600;display:grid;place-items:center;padding:0 9px}
.bbtn{min-width:58px;height:48px;border-radius:12px;background:var(--gold);color:#3a2c05;
  font-family:var(--display);font-weight:900;font-size:19px;display:grid;place-items:center;
  box-shadow:0 2px 0 var(--gold-dk);transition:.14s}
.bbtn:active{transform:translateY(2px);box-shadow:none}
.bbtn.on{background:#fff;color:var(--red);box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.bbtn.wide{min-width:96px;font-size:13px;font-family:var(--body);font-weight:700}

/* ===== لوحة الرسم ===== */
.draw{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);
  padding:8px 6px 4px;margin-bottom:12px}
.elev{width:100%;height:auto;display:block;direction:ltr}
.elev .bay{cursor:pointer}
.elev .cavity{fill:#2a2320}
.elev .shutter{fill:#9aa3a8;transform-origin:center top;transition:transform .32s cubic-bezier(.3,.9,.3,1)}
.elev .bay.open .shutter{transform:scaleY(.1)}
.elev .baylbl{font-family:var(--mono);font-size:13px;font-weight:600;fill:#2a2320;pointer-events:none}
.elev .bay.open .baylbl{fill:var(--gold)}
.elev .frame{fill:none;stroke:#2a2320;stroke-width:2}
.elev .bay.open .frame{stroke:var(--gold);stroke-width:2.5}
.elev .cablbl{font-family:var(--mono);font-size:11px;fill:#fff;opacity:.9;pointer-events:none}

/* ===== بطاقات وبيانات ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;margin-bottom:12px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:12px 0 4px}
.spec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--sh)}
.spec b{display:block;font-size:11px;color:var(--muted);font-weight:500}
.spec i{font-style:normal;font-size:15px;font-weight:700;color:var(--ink)}
.mtag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card)}
.mtag b{color:var(--ink);font-weight:700}
.metarow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.codechip{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:8px;
  background:var(--gold-soft);color:#7a5c05;border:1px solid #EBD9A2;white-space:nowrap}

/* ===== الخانات ===== */
.comp{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  margin-bottom:9px;overflow:hidden}
.comp.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(243,193,58,.35),var(--sh)}
.comp>.ch{display:flex;align-items:center;gap:11px;width:100%;padding:13px;text-align:start}
.tag{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-family:var(--display);font-weight:900;font-size:16px;background:var(--gold);color:#3a2c05}
.comp .ch .t{flex:1;min-width:0}
.comp .ch .t b{display:block;font-weight:700;font-size:14.5px;color:var(--ink)}
.comp .ch .t span{display:block;font-size:11.5px;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.comp.active .chev{transform:rotate(-90deg);color:var(--red)}
html[dir="rtl"] .chev{transform:scaleX(-1)}
html[dir="rtl"] .comp.active .chev{transform:scaleX(-1) rotate(90deg)}
.body{display:none;padding:0 10px 10px;animation:fade .22s ease}
.comp.active .body{display:block}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.cnote{border-inline-start:4px solid var(--red);background:#FDF0F1;border-radius:9px;padding:9px 12px;
  font-size:12.5px;color:#7c2531;margin-bottom:9px}

/* ===== بطاقات المعدات ===== */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  padding:9px;text-align:center;display:flex;flex-direction:column;transition:.15s}
.item:active{transform:scale(.98)}
.item .ph{height:82px;border-radius:10px;background:#F7F3ED center/cover no-repeat;display:grid;place-items:center;
  margin-bottom:8px;border:1px solid var(--line2)}
.item .ph svg{width:30px;height:30px;color:#C9BCAC}
.item b{display:block;font-family:var(--display);font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.4}
.item i{font-style:normal;display:block;font-size:11px;color:var(--muted);margin-top:3px;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .go{margin-top:8px;background:var(--gold);color:#3a2c05;border-radius:9px;padding:6px;
  font-size:11.5px;font-weight:700;box-shadow:0 2px 0 var(--gold-dk)}
.item .qty{font-family:var(--mono);font-size:11px;color:var(--red)}
.empty{border:2px dashed var(--line);border-radius:13px;padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--card)}
.empty b{display:block;color:var(--ink);font-weight:700;margin-bottom:3px;font-size:14px}

/* ===== شاشة المعدة ===== */
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;margin-bottom:14px}
.hero .cv{height:6px;background:var(--chevron)}
.hero .shot{background:#F7F3ED;border-bottom:1px solid var(--line2)}
.hero .shot img{display:block;width:100%;max-height:270px;object-fit:contain}
.hero .noshot{height:150px;display:grid;place-items:center;background:#F7F3ED;border-bottom:1px solid var(--line2)}
.hero .noshot svg{width:46px;height:46px;color:#CFC2B2}
.hero .in{padding:14px 15px 16px;text-align:center}
.chip{display:inline-block;font-size:11px;padding:4px 11px;border-radius:999px;
  background:var(--gold-soft);color:#7a5c05;border:1px solid #EBD9A2}
.hero h1{margin:9px 0 3px;font-size:21px}
.hero .en{font-family:var(--mono);font-size:12.5px;color:var(--muted);direction:ltr}
.crumb{font-size:12px;color:var(--muted);margin:0 0 14px;text-align:center}

/* صفوف الشرح ذات اللسان الذهبي */
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  margin-bottom:10px;display:flex;overflow:hidden}
.row .lab{background:var(--gold-soft);border-inline-start:1px solid #EBD9A2;padding:12px 10px;min-width:96px;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;
  font-size:13px;color:#7a5c05;text-align:center}
.row .val{flex:1;min-width:0;padding:12px 14px;font-size:14px}
.row .val ul{margin:0;padding-inline-start:17px}
.row .val li{margin-bottom:5px}
.row.danger .lab{background:#FDF0F1;border-inline-start-color:#F3D2D6;color:#9B2130}
.row.danger .val li::marker{color:var(--red)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:9px;margin-bottom:8px}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:11px;font-weight:700;
  width:21px;height:21px;flex:none;border-radius:7px;background:var(--gold);color:#3a2c05;
  display:grid;place-items:center;margin-top:3px}
.navbar{display:flex;gap:9px;background:linear-gradient(180deg,var(--red2),var(--red));border-radius:14px;
  padding:9px;margin-top:14px;box-shadow:var(--sh)}
.navbar button{flex:1;background:var(--gold);color:#3a2c05;border-radius:10px;padding:11px;
  font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 2px 0 var(--gold-dk)}
.navbar button:disabled{opacity:.4}
.navbar svg{width:15px;height:15px}

/* ===== بحث ===== */
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;margin-bottom:14px;box-shadow:var(--sh)}
.searchbar input{flex:1;background:none;border:0;outline:none;font-size:15px;min-width:0}
.searchbar svg{width:17px;height:17px;color:var(--muted);flex:none}
.sitem{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;text-align:start;background:var(--card);
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--sh)}
.sitem .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
.sitem .t{flex:1;min-width:0}
.sitem .t b{display:block;font-weight:700;font-size:14px;color:var(--ink)}
.sitem .t span{display:block;font-size:11.5px;color:var(--muted)}

/* ===== أزرار ===== */
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin:14px 0 10px}
.back svg{width:15px;height:15px}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 15px;
  font-size:13.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:7px;
  box-shadow:var(--sh);transition:.15s}
.btn:active{transform:scale(.96)}
.btn svg{width:15px;height:15px}
.btn.p{background:var(--gold);border-color:var(--gold-dk);color:#3a2c05;box-shadow:0 2px 0 var(--gold-dk)}
.btn.d{color:#9B2130;border-color:#F0CDD2;background:#FDF3F4}
.btn.blk{width:100%;justify-content:center}

/* ===== أوراق سفلية ===== */
.scrim{position:fixed;inset:0;background:rgba(35,24,18,.5);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:95;background:var(--card);
  border-radius:22px 22px 0 0;max-height:88dvh;overflow-y:auto;transform:translateY(102%);
  transition:transform .28s cubic-bezier(.3,.9,.3,1);padding:0 16px calc(20px + env(safe-area-inset-bottom));
  max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(60,40,20,.2)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet h3{font-family:var(--display);font-size:17px;margin:8px 0 14px;color:var(--ink)}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;background:#FBF8F4;border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;outline:none;font-size:14.5px;transition:.15s;color:var(--ink)}
.f input:focus,.f textarea:focus{border-color:var(--gold-dk);background:#fff}
.f textarea{min-height:88px;resize:vertical;line-height:1.7}
.f .hint{font-size:11px;color:var(--muted);margin-top:4px}
.f.ltr input,.f.ltr textarea{direction:ltr;text-align:start;font-family:var(--mono);font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{height:150px;border-radius:12px;border:2px dashed var(--line);background:#FBF8F4 center/cover no-repeat;
  display:grid;place-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
.prev.has{border-style:solid}
.prev i{font-style:normal;background:rgba(255,255,255,.8);padding:5px 12px;border-radius:999px}
.prev.has i{display:none}

/* ===== شريط التبويبات ===== */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;
  box-shadow:0 -3px 16px rgba(60,40,20,.07)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;
  color:var(--muted);font-size:10.5px;font-weight:700;border-radius:12px;position:relative;transition:.15s}
.tabs button svg{width:21px;height:21px}
.tabs button.on{color:var(--red)}
.tabs button.on::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:2px;background:var(--gold)}
.tabs .bdg{position:absolute;top:2px;inset-inline-end:22%;min-width:16px;height:16px;border-radius:9px;
  background:var(--red);color:#fff;font-size:9.5px;font-family:var(--mono);display:none;place-items:center;padding:0 4px}
.tabs .bdg.on{display:grid}

/* ===== الحساب ===== */
.acct{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.acct .cv{height:6px;background:var(--chevron)}
.acct .in{padding:16px;display:flex;align-items:center;gap:13px}
.avatar{width:54px;height:54px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--red2),var(--red-dk));font-family:var(--display);font-weight:900;font-size:20px;color:#fff}
.acct .who{flex:1;min-width:0}
.acct .who b{display:block;font-family:var(--display);font-size:17px;color:var(--ink)}
.acct .who span{display:block;font-size:12.5px;color:var(--red);font-weight:700;margin-top:2px}
.acct .who i{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px;direction:ltr;text-align:start}
.arow{display:flex;align-items:center;gap:11px;width:100%;padding:13px 16px;border-top:1px solid var(--line2);text-align:start}
.arow .t{flex:1;min-width:0}
.arow .t b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.arow .t span{display:block;font-size:11.5px;color:var(--muted)}
.arow .ic{width:36px;height:36px;border-radius:11px;background:var(--gold-soft);border:1px solid #EBD9A2;
  display:grid;place-items:center;flex:none;color:#8a6708}
.arow .ic svg{width:16px;height:16px}
.sw{width:44px;height:25px;border-radius:999px;background:#E5DED4;flex:none;position:relative;transition:.18s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.sw.on{background:var(--gold)}
.sw.on::after{inset-inline-start:22px}

/* ===== الإشعارات ===== */
.notice{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  padding:13px 15px;margin-bottom:10px;position:relative;overflow:hidden}
.notice.new{border-color:var(--gold)}
.notice.new::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:4px;background:var(--gold)}
.notice h4{margin:0 0 5px;font-size:15px;font-family:var(--display);font-weight:700;color:var(--ink)}
.notice p{margin:0;font-size:13.5px;white-space:pre-wrap}
.notice time{display:block;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}

/* ===== الدخول والتدريب ===== */
.demo{border:2px dashed var(--gold-dk);background:var(--gold-soft);border-radius:12px;padding:12px 14px;
  font-size:12.5px;color:#7a5c05;margin-bottom:12px}
.demo b{font-family:var(--mono);font-size:19px;letter-spacing:.3em;display:block;margin-top:6px;color:var(--red)}
.lock{text-align:center;padding:28px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--sh)}
.lock svg{width:40px;height:40px;color:var(--red);margin-bottom:10px}
.lock b{display:block;font-family:var(--display);font-size:17px;margin-bottom:5px;color:var(--ink)}
.lock p{margin:0 0 16px;color:var(--muted);font-size:13px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  padding:13px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.tcard .n{width:32px;height:32px;flex:none;border-radius:10px;background:var(--gold);color:#3a2c05;
  display:grid;place-items:center;font-family:var(--display);font-weight:900}
.tcard .t{flex:1;min-width:0}
.tcard .t b{display:block;font-size:15.5px;font-family:var(--display);font-weight:700;color:var(--ink)}
.tcard .t span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.tcard .t em{font-style:normal;display:inline-block;margin-top:7px;font-size:11.5px;color:var(--red);font-weight:700}
.rep{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin:14px 0;box-shadow:var(--sh)}
.rep img{width:100%;display:block}
.hist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--sh)}
.hist b{display:block;font-size:13.5px;color:var(--ink)}
.hist span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

/* ===== متفرقات ===== */
.toast{position:fixed;inset-inline:0;bottom:86px;margin:0 auto;width:max-content;max-width:90%;
  background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:999px;
  z-index:120;opacity:0;transform:translateY(14px);transition:.24s;pointer-events:none;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:none}
.editbadge{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline-start:14px;z-index:70;
  background:var(--gold);color:#3a2c05;font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:999px;
  display:none;align-items:center;gap:6px;box-shadow:var(--sh2)}
.editbadge.on{display:flex}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline-end:14px;z-index:70;
  width:54px;height:54px;border-radius:18px;background:var(--red);display:none;place-items:center;
  box-shadow:0 8px 22px rgba(168,27,45,.4)}
.fab.on{display:grid}
.fab svg{width:22px;height:22px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:26px;line-height:1.9}

   ========================================================= */

const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const v = window.localStorage && localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async set(k,v){
    const s = JSON.stringify(v);
    try{ if(window.storage){ await window.storage.set(k,s); return true; } }catch(e){}
    try{ localStorage.setItem(k,s); return true; }catch(e){ return false; }
  },
  async del(k){
    try{ if(window.storage){ await window.storage.delete(k); return; } }catch(e){}
    try{ localStorage.removeItem(k); }catch(e){}
  },
  async keys(prefix){
    try{ if(window.storage){ const r = await window.storage.list(prefix); return (r&&r.keys)||[]; } }catch(e){}
    try{ return Object.keys(localStorage).filter(k=>k.startsWith(prefix)); }catch(e){ return []; }
  }
};

  const BW = 78, GAP = 7, PAD = 14;
  const cabW = cabs.length>1 ? 200 : 122;
  const bodyW = Math.max(cabW + 10 + bays.length*(BW+GAP), cabW + 120);
  const W = bodyW + PAD*2, H = 196;
  const x0 = PAD, bodyTop = 34, bodyBot = 148;
  const X = (x,w=0) => flip ? (W - x - w) : x;   // مرآة الإحداثيات

  let s = `<svg class="elev" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(v.name))}">
  <defs>
    <linearGradient id="bd${uidg}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8353C"/><stop offset=".55" stop-color="#C51F26"/><stop offset="1" stop-color="#8E1116"/>
    </linearGradient>
    <linearGradient id="gl${uidg}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5b63"/><stop offset="1" stop-color="#1d262b"/>
    </linearGradient>
    <linearGradient id="sg${uidg}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ccd1"/><stop offset="1" stop-color="#7d878d"/>
    </linearGradient>
    <pattern id="rib${uidg}" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="url(#sg${uidg})"/><rect y="4" width="6" height="2" fill="rgba(0,0,0,.28)"/>
    </pattern>
  </defs>`;
  s += `<rect x="0" y="${H-16}" width="${W}" height="1.5" fill="#2b231d"/>`;
  s += `<rect x="${X(x0,bodyW)}" y="${bodyTop}" width="${bodyW}" height="${bodyBot-bodyTop}" rx="9" fill="url(#bd${uidg})"/>`;

  // معدات السقف حسب نوع السيارة
  if(v.id==='ladder'){
    s += `<rect x="${X(x0+cabW,bodyW-cabW-6)}" y="${bodyTop-16}" width="${bodyW-cabW-6}" height="11" rx="3" fill="#cfd6da"/>
          <rect x="${X(x0+cabW+4,bodyW-cabW-14)}" y="${bodyTop-13}" width="${bodyW-cabW-14}" height="5" rx="2" fill="#8b949a"/>
          <circle cx="${X(x0+bodyW-24)}" cy="${bodyTop-10}" r="7" fill="#FFC000"/>`;
  } else if(v.id==='sky'){
    s += `<rect x="${X(x0+cabW+14,bodyW-cabW-40)}" y="${bodyTop-13}" width="${bodyW-cabW-40}" height="9" rx="3" fill="#b9c1c6"/>`;
  } else if(v.id==='arff'){
    s += `<rect x="${X(x0+cabW+20,bodyW-cabW-52)}" y="${bodyTop-12}" width="${bodyW-cabW-52}" height="7" rx="3" fill="#cfd6da"/>
          <circle cx="${X(x0+cabW+18)}" cy="${bodyTop-9}" r="5" fill="#FFC000"/>`;
  }
  // شريط الإنارة
  s += `<rect x="${X(x0+16,cabW-32)}" y="${bodyTop-9}" width="${cabW-32}" height="8" rx="3" fill="#2a2320"/>
        <rect x="${X(x0+20,(cabW-40)/2)}" y="${bodyTop-7}" width="${(cabW-40)/2}" height="4" rx="2" fill="#FF4046"/>
        <rect x="${X(x0+20+(cabW-40)/2,(cabW-40)/2)}" y="${bodyTop-7}" width="${(cabW-40)/2}" height="4" rx="2" fill="#FFC000"/>`;

  // الكابينات
  cabs.forEach((c,i)=>{
    const cx = i===0 ? x0+9 : x0+87;
    const cw = i===0 ? (cabs.length>1?70:66) : cabW-96;
    const on = activeId===c.id;
    s += `<g class="bay ${on?'open':''}" data-c="${c.id}" tabindex="0" role="button" aria-label="${esc(t(c.name))}">
      <rect x="${X(cx,cw)}" y="${bodyTop+9}" width="${cw}" height="40" rx="6" fill="url(#gl${uidg})"/>
      <rect x="${X(cx,cw)}" y="${bodyTop+9}" width="${cw}" height="40" rx="6" fill="${on?'rgba(255,192,0,.32)':'transparent'}" stroke="${on?'#FFC000':'transparent'}" stroke-width="2"/>
      <text class="cablbl" x="${X(cx+cw/2)}" y="${bodyTop+34}" text-anchor="middle">${i===0?'CAB':'CREW'}</text>
    </g>`;
  });
  // الشريط العاكس + الشيفرون الخلفي
  s += `<rect x="${X(x0,bodyW)}" y="${bodyBot-16}" width="${bodyW}" height="9" fill="#FFC000" opacity=".92"/>`;
  s += `<rect x="${X(x0+bodyW-9,9)}" y="${bodyTop}" width="9" height="${bodyBot-bodyTop}" fill="#FFE14D"/>`;

  // الخانات
  bays.forEach((c,i)=>{
    const bx = x0 + cabW + 10 + i*(BW+GAP);
    const by = bodyTop + 14, bh = 74;
    const on = activeId===c.id;
    s += `<g class="bay ${on?'open':''}" data-c="${c.id}" tabindex="0" role="button" aria-label="${esc(t(c.name))}">
      <rect class="cavity" x="${X(bx,BW)}" y="${by}" width="${BW}" height="${bh}" rx="4"/>
      <rect class="shutter" x="${X(bx+2,BW-4)}" y="${by+2}" width="${BW-4}" height="${bh-4}" rx="3" fill="url(#rib${uidg})"/>
      <text class="baylbl" x="${X(bx+BW/2)}" y="${by+22}" text-anchor="middle">${c.no}</text>
      <rect class="frame" x="${X(bx,BW)}" y="${by}" width="${BW}" height="${bh}" rx="4"/>
    </g>`;
  });
  // العجلات
  const wy = bodyBot + 4;
  const ws = [x0+52, x0+bodyW-52];
  if(bodyW>430) ws.push(x0+bodyW-104);
  ws.forEach(wx=>{ const c = X(wx);
    s += `<circle cx="${c}" cy="${wy}" r="22" fill="#15110f"/><circle cx="${c}" cy="${wy}" r="11" fill="#3b332d"/><circle cx="${c}" cy="${wy}" r="4" fill="#6b5f55"/>`; });
  s += `</svg>`;
  return s;
}

function viewVehicle(id){

  let h = `<h1>${esc(t(v.name))}</h1>

  if(L.length) h += `<div class="eyebrow">${T('leftS')}</div><div class="draw">${elevation(v,{side:'يسار',activeId:active})}</div>`
                 + L.map(c=>compHTML(v,c,active)).join('');

                 + R.map(c=>compHTML(v,c,active)).join('');

  X.forEach(c=>{ h += `<div class="eyebrow">${esc(t(c.name))}</div>` + compHTML(v,c,active); });

    v.specs.forEach(x=>{ h += `<div class="spec"><b>${esc(t(x.k))}</b><i>${esc(t(x.v))}</i></div>`; });

      <button class="btn" onclick="editComp('${v.id}',null)">+ ${T('addComp')}</button></div>`;
  }
  return h;
}

function viewItem(vid,cid,iid){
  const v = findV(vid), c = findC(v,cid);
  const it = c && c.items.find(x=>x.id===iid);
  if(!it) return viewFleet();
  const row = (label, val, kind) => {
    const L = lines(t(val)); if(!L.length) return '';
    let inner;
    if(kind==='steps') inner = `<ol class="steps">${L.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol>`;
    else if(kind==='specs') inner = `<div class="specs" style="margin:0">${L.map(x=>{
        const i2 = x.indexOf(':'); const k = i2>0?x.slice(0,i2).trim():x; const val2 = i2>0?x.slice(i2+1).trim():'—';
        return `<div class="spec" style="box-shadow:none"><b>${esc(k)}</b><i>${esc(val2)}</i></div>`;}).join('')}</div>`;
    else inner = L.length===1 ? `<p style="margin:0">${esc(L[0])}</p>` : `<ul>${L.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    return `<div class="row ${kind==='danger'?'danger':''}"><span class="lab">${label}</span><span class="val">${inner}</span></div>`;
  };
  const im = IMGS[it.id];
  const idx = c.items.findIndex(x=>x.id===iid);
  const prev = idx>0 ? c.items[idx-1] : null;
  const next = idx < c.items.length-1 ? c.items[idx+1] : null;

  let h = `<div class="hero">
    ${im?`<div class="shot"><img src="${im}" alt="${esc(t(it.name))}" loading="lazy"></div>`
        :`<div class="noshot">${PHIC}</div>`}
    <div class="in">
      ${it.cat?`<span class="chip">${esc(it.cat)}</span>`:''}
      <h1>${esc(t(it.name))}</h1>
      <div class="en">${esc(lang?it.name.ar:(it.name.en||''))}</div>
    </div></div>
  <p class="crumb">${esc(t(v.name))} › ${esc(t(c.name))}</p>
  <div class="row"><span class="lab">${T('nameLbl')}</span><span class="val"><p style="margin:0">${esc(t(it.name))}</p></span></div>`;
  h += row(T('defT'), it.def, '');
  h += row(T('usesLbl'), it.uses, '');
  h += row(T('howLbl'), it.howto, 'steps');
  h += row(T('hazLbl'), it.hazards, 'danger');
  h += row(T('techLbl'), it.tech, 'specs');
  h += row(T('notesLbl'), it.notes, '');
  h += `<div class="navbar">
    <button ${prev?`onclick="go('#/e/${vid}/${cid}/${prev.id}')"`:'disabled'}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg>${T('prev')}</button>
    <button ${next?`onclick="go('#/e/${vid}/${cid}/${next.id}')"`:'disabled'}>${T('next')}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
  </div>`;
  if(admin && editMode){
    h += `<div class="actions">
      <button class="btn p" onclick="editItem('${vid}','${cid}','${iid}')">${T('editItem')}</button>
      <button class="btn d" onclick="delItem('${vid}','${cid}','${iid}')">${T('del')}</button>
    </div>`;
  }
  return h;
}

function renderResults(){
  const box = $('#res'); if(!box) return;
  const s = q.trim().toLowerCase();
  if(!s){ box.innerHTML = `<div class="empty"><b>${lang?'Type to search':'اكتب للبحث'}</b>${lang?'Equipment, compartments and appliances.':'المعدات والخانات والسيارات.'}</div>`; return; }
  let out = '', n = 0;
  DB.vehicles.forEach(v=>{
    if((t(v.name)+v.code).toLowerCase().includes(s)){
      n++; out += `<button class="sitem" onclick="go('#/v/${v.id}')"><span class="dot"></span>
        <span class="t"><b>${esc(t(v.name))}</b><span>${esc(v.code)} · ${lang?'appliance':'سيارة'}</span></span></button>`;
    }
    v.compartments.forEach(c=>{
      c.items.forEach(it=>{
        const hay = (it.name.ar+' '+it.name.en+' '+it.cat+' '+it.uses.ar).toLowerCase();
        if(hay.includes(s)){
          n++; out += `<button class="sitem" onclick="go('#/e/${v.id}/${c.id}/${it.id}')"><span class="dot"></span>
            <span class="t"><b>${esc(t(it.name))}</b><span>${esc(t(v.name))} · ${esc(t(c.name))}</span></span></button>`;
        }
      });
    });
  });
  box.innerHTML = n ? out : `<div class="empty"><b>${T('noRes')}</b>${T('noResS')}</div>`;
}

  DB.vehicles.forEach(v=>v.compartments.forEach(c=>c.items.forEach(it=>{
    const hasHow = lines(it.howto && it.howto.ar).length >= 2;
    if(hasHow && TRAIN_CATS.includes(it.cat)) out.push({v,c,it});
  })));
  return out;
}
function pickDrill(){
  const list = candidates();
  if(list.length < 2){ toast(T('noCands')); return; }
  let i = Math.floor(Math.random()*list.length), j = i;
  let guard = 0;
  while((j===i || list[j].it.name.ar===list[i].it.name.ar) && guard++ < 60) j = Math.floor(Math.random()*list.length);
  const keep = drill || {};
  drill = {a:list[i], b:list[j], type:keep.type||0, trainer:keep.trainer||(admin?ADMIN_NAME:''),
           count:keep.count||'', date:keep.date||new Date().toISOString().slice(0,10), notes:keep.notes||'', png:null};
  render();
}

/* رسم التقرير على canvas */
function loadLogo(){
  return new Promise(res=>{
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = './logo.png';

}
async function makeReport(){
  if(!drill) return;
  ['d_trainer','d_count','d_notes','d_date'].forEach(id=>{
    const e = document.getElementById(id); if(!e) return;
    if(id==='d_trainer') drill.trainer = e.value;
    if(id==='d_count') drill.count = e.value;
    if(id==='d_notes') drill.notes = e.value;
    if(id==='d_date') drill.date = e.value;
  });
  const sel = document.getElementById('d_type'); if(sel) drill.type = sel.selectedIndex;

  const W = 1080, H = 1500;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.direction = 'rtl'; x.textAlign = 'right';
  const F = (w,sz)=>`${w} ${sz}px "IBM Plex Sans Arabic","Noto Kufi Arabic",system-ui,sans-serif`;

  x.fillStyle = '#ffffff'; x.fillRect(0,0,W,H);
  // شريط الشيفرون
  for(let i=-60;i<W+60;i+=44){
    x.fillStyle = '#D8232A'; x.beginPath(); x.moveTo(i,0); x.lineTo(i+22,0); x.lineTo(i+22-18,16); x.lineTo(i-18,16); x.closePath(); x.fill();
    x.fillStyle = '#FFC000'; x.beginPath(); x.moveTo(i+22,0); x.lineTo(i+44,0); x.lineTo(i+44-18,16); x.lineTo(i+22-18,16); x.closePath(); x.fill();
  }
  const logo = await loadLogo();
  if(logo) x.drawImage(logo, W/2-72, 44, 144, 144);

  x.textAlign = 'center';
  x.fillStyle = '#14100E'; x.font = F(700,34);
  x.fillText('الإدارة العامة للدفاع المدني', W/2, 232);
  x.fillStyle = '#8A7C70'; x.font = F(500,22);
  x.fillText('وزارة الداخلية · دولة قطر', W/2, 268);
  x.fillStyle = '#D8232A'; x.font = F(700,42);
  x.fillText('تقرير تدريب على المعدات', W/2, 336);

  x.strokeStyle = '#E4DCD3'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(70,372); x.lineTo(W-70,372); x.stroke();

  x.textAlign = 'right';
  let y = 430;
  const row = (k,v)=>{
    x.fillStyle = '#8A7C70'; x.font = F(500,24); x.fillText(k, W-70, y);
    x.fillStyle = '#14100E'; x.font = F(600,30); x.fillText(v||'—', W-260, y);
    x.strokeStyle = '#F0EAE3'; x.beginPath(); x.moveTo(70,y+22); x.lineTo(W-70,y+22); x.stroke();
    y += 66;
  };
  row('التاريخ', drill.date);
  row('نوع التدريب', UI.types[0][drill.type]||'—');
  row('المدرّب', drill.trainer);
  row('عدد المتدربين', drill.count);

  y += 18;
  x.fillStyle = '#D8232A'; x.font = F(700,30);
  x.fillText('المعدتان المختارتان', W-70, y); y += 26;

  const box = (n, it, v, c) => {
    const bh = 168;
    x.fillStyle = '#FAF6F1'; x.strokeStyle = '#E4DCD3';
    x.beginPath(); x.roundRect(70, y, W-140, bh, 16); x.fill(); x.stroke();
    x.fillStyle = '#FFC000';
    x.beginPath(); x.roundRect(W-140, y+22, 52, 52, 12); x.fill();
    x.textAlign = 'center'; x.fillStyle = '#1A1206'; x.font = F(700,28);
    x.fillText(String(n), W-114, y+58);
    x.textAlign = 'right';
    x.fillStyle = '#14100E'; x.font = F(700,34);
    x.fillText(it, W-160, y+56);
    x.fillStyle = '#6D6055'; x.font = F(500,24);
    x.fillText(v, W-160, y+98);
    x.fillStyle = '#8A7C70'; x.font = F(500,22);
    x.fillText(c, W-160, y+136);
    y += bh + 18;
  };
  box(1, t(drill.a.it.name), t(drill.a.v.name), t(drill.a.c.name));
  box(2, t(drill.b.it.name), t(drill.b.v.name), t(drill.b.c.name));

  if(drill.notes){
    y += 10;
    x.fillStyle = '#8A7C70'; x.font = F(500,24); x.fillText('ملاحظات', W-70, y); y += 36;
    x.fillStyle = '#14100E'; x.font = F(500,26);
    const words = String(drill.notes).replace(/\n/g,' ').split(' ');
    let line = '';
    words.forEach(w=>{
      const test = line ? line+' '+w : w;
      if(x.measureText(test).width > W-160){ x.fillText(line, W-70, y); y += 38; line = w; }
      else line = test;
    });
    if(line) x.fillText(line, W-70, y);
  }

  // تذييل
  x.fillStyle = '#14100E'; x.fillRect(0,H-96,W,96);
  x.textAlign = 'center'; x.fillStyle = '#F2EBE3'; x.font = F(600,24);
  x.fillText('تطبيق أسطول الدفاع المدني — مرجع تدريبي', W/2, H-52);
  x.fillStyle = '#A8988B'; x.font = F(500,20);
  x.fillText('يُعتمد دائمًا دليل الشركة المصنّعة والتعليمات الرسمية', W/2, H-22);

  drill.png = cv.toDataURL('image/png');
  if(!DB.trainings) DB.trainings = [];
  DB.trainings.push({id:uid('t'), at:Date.now(), date:drill.date, type:UI.types[0][drill.type]||'',
    a:t(drill.a.it.name), b:t(drill.b.it.name), trainer:drill.trainer, count:drill.count});
  await save();
  render();
  setTimeout(()=>{ const im = document.querySelector('.rep'); if(im) im.scrollIntoView({behavior:'smooth',block:'center'}); }, 120);
}
function reportName(){ return 'تقرير-تدريب-'+(drill&&drill.date||'').replace(/-/g,'')+'.png'; }
function dataURLtoFile(){
  const b = atob(drill.png.split(',')[1]);
  const u = new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i);
  return new File([u], reportName(), {type:'image/png'});
}
function reportText(){
  return 'تقرير تدريب على المعدات\n'
    + 'التاريخ: ' + drill.date + '\n'
    + 'نوع التدريب: ' + (UI.types[0][drill.type]||'') + '\n'
    + 'المعدة 1: ' + t(drill.a.it.name) + ' — ' + t(drill.a.v.name) + '\n'
    + 'المعدة 2: ' + t(drill.b.it.name) + ' — ' + t(drill.b.v.name)
    + (drill.trainer ? '\nالمدرّب: ' + drill.trainer : '');
}
async function shareReport(){
  if(!drill || !drill.png) return;
  try{
    const f = dataURLtoFile();
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], text:reportText()});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  downloadReport();
  window.open('https://wa.me/?text='+encodeURIComponent(reportText()), '_blank');
  toast(lang?'Image saved — attach it in WhatsApp.':'حُفظت الصورة — أرفقها في واتساب.');
}
function downloadReport(){
  if(!drill || !drill.png) return;
  const a = document.createElement('a');
  a.href = drill.png; a.download = reportName(); a.click();
}
function printReport(){
  if(!drill || !drill.png) return;
  const w = window.open('', '_blank');
  if(!w){ toast(lang?'Allow pop-ups to print.':'اسمح بالنوافذ المنبثقة للطباعة.'); return; }
  w.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>'
    + reportName() + '</title><style>@page{margin:0}body{margin:0}img{width:100%;display:block}</style></head><body><img src="'
    + drill.png + '"></body></html>');
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 400);
}

document.getElementById('imgIn').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value='';
  if(!f) return;
  try{
    const d = await shrinkImage(f);
    pendingImg = d;
    const p = document.getElementById('i_prev');
    if(p){ p.style.backgroundImage = `url('${d}')`; p.classList.add('has'); }
  }catch(err){ toast(lang?'Image not readable — try another file.':'تعذّرت قراءة الصورة — جرّب ملفًا آخر.'); }
});
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const MAX = 1000;
        const k = Math.min(1, MAX/Math.max(im.width,im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.72));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function setImage(id,data){

  const v = findV(vid), c = findC(v,cid); const L = lang?'en':'ar';
  let it = iid ? c.items.find(x=>x.id===iid) : null;
  if(!it){ it = {id:uid('e'),name:{ar:'',en:''},cat:'',qty:'',def:{ar:'',en:''},uses:{ar:'',en:''},howto:{ar:'',en:''},
                 hazards:{ar:'',en:''},notes:{ar:'',en:''},tech:{ar:'',en:''}}; c.items.push(it); }
  if(!it.tech) it.tech = {ar:'',en:''};
  it.name.ar = val('i_ar') || it.name.ar; it.name.en = val('i_en');
  it.cat = val('i_cat'); it.qty = val('i_qty');
  if(!it.def) it.def = {ar:'',en:''};
  it.def[L] = val('i_def');
  it.tech[L] = val('i_tech');
  it.uses[L] = val('i_uses'); it.howto[L] = val('i_how'); it.hazards[L] = val('i_haz'); it.notes[L] = val('i_note');
  if(pendingImg !== undefined) await setImage(it.id, pendingImg);
  pendingImg = undefined;
  await save(); closeSheet(); openComp = cid; render(); toast(T('saved'));
}
async function delItem(vid,cid,iid){
  if(!confirm(T('confirmDel'))) return;
  const c = findC(findV(vid),cid);
  c.items = c.items.filter(x=>x.id!==iid);
  await setImage(iid,null);
  await save(); openComp = cid; go('#/v/'+vid); render(); toast(T('deleted'));
}

function editComp(vid,cid){
  const v = findV(vid); const c = cid ? findC(v,cid) : null;
  const sides = UI.sides[lang];
  openSheet(`<h3>${cid?T('editComp'):T('addComp')}</h3>
    ${field('c_ar',T('nameAr'),c?c.name.ar:'')}
    ${field('c_en',T('nameEn'),c?c.name.en:'',{ltr:true})}
    <div class="f"><label>${T('side')}</label><select id="c_side">
      ${sides.map((s,i)=>`<option value="${esc(UI.sides[0][i])}" ${c&&c.side===UI.sides[0][i]?'selected':''}>${esc(s)}</option>`).join('')}
    </select></div>
    <div class="actions" style="margin-bottom:6px">
      <button class="btn p" style="flex:1;justify-content:center" onclick="saveComp('${vid}','${cid||''}')">${T('save')}</button>
      ${cid?`<button class="btn d" onclick="delComp('${vid}','${cid}')">${T('del')}</button>`:''}
      <button class="btn" onclick="closeSheet()">${T('cancel')}</button>
    </div>`);
}
async function saveComp(vid,cid){
  const v = findV(vid); let c = cid ? findC(v,cid) : null;
  if(!c){ c = {id:uid('c'),no:bayCount(v)+1,kind:'bay',side:'يمين',name:{ar:'',en:''},note:{ar:'',en:''},items:[]}; v.compartments.push(c); }
  c.name.ar = val('c_ar') || c.name.ar; c.name.en = val('c_en');
  const sel = document.getElementById('c_side'); if(sel) c.side = sel.value;
  await save(); closeSheet(); openComp = c.id; render(); toast(T('saved'));
}
async function delComp(vid,cid){
  if(!confirm(T('confirmDel'))) return;
  const v = findV(vid);
  v.compartments = v.compartments.filter(c=>c.id!==cid);
  v.compartments.filter(c=>c.kind==='bay').forEach((c,i)=>c.no=i+1);
  await save(); closeSheet(); openComp=null; render(); toast(T('deleted'));
}

function editVehicle(vid){
  const v = vid ? findV(vid) : null;
  openSheet(`<h3>${vid?T('editVeh'):(lang?'Add appliance':'إضافة سيارة')}</h3>
    ${field('v_ar',T('nameAr'),v?v.name.ar:'')}
    ${field('v_en',T('nameEn'),v?v.name.en:'',{ltr:true})}
    <div class="row2">${field('v_code','CODE',v?v.code:'',{ltr:true})}${field('v_mk',lang?'Maker':'الشركة',v?v.maker:'روزنباور')}</div>
    ${field('v_note',T('vehNote'),v?t(v.note):'',{area:true})}
    <div class="actions" style="margin-bottom:6px">
      <button class="btn p" style="flex:1;justify-content:center" onclick="saveVehicle('${vid||''}')">${T('save')}</button>
      ${vid?`<button class="btn d" onclick="delVehicle('${vid}')">${T('del')}</button>`:''}
      <button class="btn" onclick="closeSheet()">${T('cancel')}</button>
    </div>`);
}
async function saveVehicle(vid){
  let v = vid ? findV(vid) : null; const L = lang?'en':'ar';
  if(!v){ v = {id:uid('v'),code:'NEW',maker:'Rosenbauer',name:{ar:'',en:''},note:{ar:'',en:''},specs:[],
    compartments:[{id:uid('c'),no:0,kind:'cab',side:'—',name:{ar:'كابينة السائق',en:'Driver cab'},note:{ar:'',en:''},items:[]}]};
    DB.vehicles.push(v); }
  v.name.ar = val('v_ar') || v.name.ar; v.name.en = val('v_en');
  v.code = val('v_code') || v.code; v.maker = val('v_mk') || v.maker;
  v.note[L] = val('v_note');
  await save(); closeSheet(); go('#/v/'+v.id); render(); toast(T('saved'));
}
async function delVehicle(vid){
  if(!confirm(T('confirmDel'))) return;
  DB.vehicles = DB.vehicles.filter(v=>v.id!==vid);
  await save(); closeSheet(); go('#/'); render(); toast(T('deleted'));
}

/* =========================================================
   10. الإعدادات
   ========================================================= */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt = e; });

let READ = [];
function updateBadge(){
  const n = (DB.notices||[]).filter(x=>!READ.includes(x.id)).length;
  const b = $('#tabBadge'); if(!b) return;
  b.textContent = n > 9 ? '9+' : String(n);
  b.classList.toggle('on', n > 0);
}
async function markAllRead(){
  const ids = (DB.notices||[]).map(n=>n.id);
  const add = ids.filter(x=>!READ.includes(x));
  if(!add.length) return;
  READ = READ.concat(add);
  await store.set('qcd_read', READ);
  setTimeout(updateBadge, 900);
}

/* ---------- تسجيل دخول المدير ---------- */
function openLogin(){
  openSheet(`<h3>${T('loginT')}</h3>
    <p class="sub" style="font-size:13px;margin:-6px 0 14px">${T('loginS')}</p>
    <div class="f ltr"><label for="ph">${T('phone')}</label>
      <input id="ph" type="tel" inputmode="tel" placeholder="+974 XXXXXXXX" autocomplete="tel"></div>
    <div class="actions" style="margin-bottom:6px">
      <button class="btn p" style="flex:1;justify-content:center" onclick="sendCode()">${T('sendCode')}</button>
      <button class="btn" onclick="closeSheet()">${T('cancel')}</button>
    </div>`);
  setTimeout(()=>{ const e = document.getElementById('ph'); if(e) e.focus(); }, 260);
}
function sendCode(){
  const v = val('ph');
  if(!phoneOK(v)){ toast(T('wrongPhone')); return; }
  pendingCode = String(Math.floor(100000 + Math.random()*900000));
  pendingUntil = Date.now() + 5*60*1000;
  pushLocal(lang?'Verification code':'رمز التحقق', (lang?'Your code is ':'رمز الدخول: ')+pendingCode);
  openSheet(`<h3>${T('verifyT')}</h3>
    <p class="sub" style="font-size:13px;margin:-6px 0 12px">${T('verifyS')} — ${maskPhone()}</p>
    <div class="demo">${T('demoNote')}<b>${pendingCode}</b></div>
    <div class="f ltr"><label for="otp">${T('verifyT')}</label>
      <input id="otp" type="tel" inputmode="numeric" maxlength="6" placeholder="······" style="letter-spacing:.4em;text-align:center;font-size:19px"></div>
    <div class="actions" style="margin-bottom:6px">
      <button class="btn p" style="flex:1;justify-content:center" onclick="verifyCode()">${T('verify')}</button>
      <button class="btn" onclick="openLogin()">${T('resend')}</button>
    </div>`);
  setTimeout(()=>{ const e = document.getElementById('otp'); if(e) e.focus(); }, 260);
}
async function verifyCode(){
  const c = digits(val('otp'));
  if(!pendingCode || Date.now() > pendingUntil){ toast(lang?'Code expired.':'انتهت صلاحية الرمز.'); return; }
  if(c !== pendingCode){ toast(T('wrongCode')); return; }
  admin = true; pendingCode = null;
  await store.set('qcd_admin', {at:Date.now()});
  closeSheet(); go('#/account'); render();
  toast(lang?'Signed in':T('welcome'));
}
async function signOut(){
  if(!confirm(T('signoutQ'))) return;
  admin = false; editMode = false;
  await store.del('qcd_admin'); await store.set('qcd_edit', false);
  render(); toast(T('signout'));
}

/* ---------- الإشعارات ---------- */
function editNotice(){
  if(!admin) return;
  openSheet(`<h3>${T('newNotice')}</h3>
    ${field('n_t',T('nTitle'),'')}
    <div class="f"><label for="n_b">${T('nBody')}</label><textarea id="n_b"></textarea></div>
    <div class="actions" style="margin-bottom:6px">
      <button class="btn p" style="flex:1;justify-content:center" onclick="publishNotice()">${T('publish')}</button>
      <button class="btn" onclick="closeSheet()">${T('cancel')}</button>
    </div>`);
}
async function publishNotice(){
  const title = val('n_t'), body = val('n_b');
  if(!title && !body){ closeSheet(); return; }
  if(!DB.notices) DB.notices = [];
  const n = {id:uid('n'), at:Date.now(), title:title||(lang?'Notice':'إشعار'), body:body};
  DB.notices.push(n);
  READ = READ.concat([n.id]);
  await store.set('qcd_read', READ);
  await save(); closeSheet(); go('#/notices'); render();
  pushLocal(n.title, n.body);
  toast(T('published'));
}
async function delNotice(id){
  if(!confirm(T('confirmDel'))) return;
  DB.notices = (DB.notices||[]).filter(n=>n.id!==id);
  await save(); render(); toast(T('deleted'));
}

/* ---------- تنبيهات الجهاز ---------- */
function pushStatusText(){
  if(!('Notification' in window)) return lang?'Not supported on this device':'غير مدعومة على هذا الجهاز';
  if(Notification.permission==='granted') return T('pushOn');
  if(Notification.permission==='denied') return T('pushBlocked');
  return lang?'Tap to enable':'اضغط للتفعيل';
}
async function askPush(){
  if(!('Notification' in window)){ toast(pushStatusText()); return; }
  try{
    const r = await Notification.requestPermission();
    render();
    toast(r==='granted' ? T('pushOn') : T('pushBlocked'));
  }catch(e){ toast(T('pushBlocked')); }
}
function pushLocal(title, body){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title, {body:(body||'').slice(0,160), tag:'qcd'});
    }
  }catch(e){}
}

async function toggleEdit(){
  if(!admin){ openLogin(); return; }
  editMode = !editMode; await store.set('qcd_edit',editMode); render();
  toast(editMode?(lang?'Edit mode on':'وضع التعديل مُفعّل'):(lang?'Edit mode off':'وضع التعديل مُعطّل'));
}
function exportJSON(){
  const b = new Blob([JSON.stringify({...DB, images:IMGS},null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'qcd-fleet-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
document.getElementById('fileIn').addEventListener('change',async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d.vehicles) throw new Error('bad');
    if(d.images){ for(const k in d.images) await setImage(k, d.images[k]); delete d.images; }
    DB = d; await save(); closeSheet(); go('#/'); render(); toast(T('imported'));
  }catch(err){ toast(lang?'File not readable — expected the app\'s JSON export.':'الملف غير صالح — المتوقع ملف JSON مُصدَّر من التطبيق.'); }
  e.target.value = '';
});
async function resetData(){
  if(!confirm(lang?'Replace all current content with the original data?':'استبدال كل المحتوى الحالي بالبيانات الأصلية؟')) return;
  DB = seed(); await save(); go('#/'); render(); toast(T('resetOk'));
}
async function doInstall(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; }
  else toast(lang?'Open in a browser, then use "Add to Home Screen".':'افتحه في المتصفح ثم اختر «إضافة إلى الشاشة الرئيسية».');
}

try{

    background_color:'#100D0B',theme_color:'#100D0B',dir:'rtl',lang:'ar',
    icons:[{src:'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#100D0B"/><path d="M20 4 L34 9v11c0 8-5.8 14-14 16-8.2-2-14-8-14-16V9Z" fill="#D8232A"/><path d="M20 12c2 3 .8 4.8-.3 6.3-1.2 1.7-2 3-.8 5 .5.9 1.3 1.5 1.3 1.5-3-.4-5.3-2.6-5.3-5.4 0-1.4.4-2.2.4-2.2 0 1.4.8 2.2 1.5 2.3.7.1 1-.5.8-1.4-.7-2.5.5-4.7 2.4-6.1Z" fill="#FFC000"/></svg>'),
      sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

/* =========================================================
   12. الإقلاع
   ========================================================= */
(async function boot(){
  IMGS = {};
  try{
    const ks = await store.keys(IMGK);
    for(const k of ks){ const d = await store.get(k); if(d) IMGS[k.slice(IMGK.length)] = d; }
  }catch(e){}
  const saved = await store.get(KEY);
  if(saved && saved.vehicles) DB = saved; else await save();
  const sl = await store.get('qcd_lang'); if(sl===1) toggleLang();
  const th = await store.get('qcd_theme');
  if(th === 'dark' || (!th && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) theme = 'dark';
  applyTheme();
  const sa = await store.get('qcd_admin');
  if(sa && sa.at && (Date.now() - sa.at) < 30*24*3600*1000) admin = true; else if(sa) await store.del('qcd_admin');
  const se = await store.get('qcd_edit'); if(se && admin) editMode = true;
  READ = (await store.get('qcd_read')) || [];
  if(!DB.notices) DB.notices = [];
  render();
})();
</script>
