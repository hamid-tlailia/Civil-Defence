<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100D0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>أسطول الدفاع المدني — قطر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#100D0B; --panel:#1B1613; --panel2:#241D18; --line:#3A2E26;
  --red:#D8232A; --red-dk:#8E1116; --amber:#FFC000; --hivis:#FFE14D;
  --text:#F2EBE3; --muted:#A8988B;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px;
  --chevron:repeating-linear-gradient(115deg,var(--red) 0 20px,#0d0b0a 20px 22px,var(--amber) 22px 42px,#0d0b0a 42px 44px);
  --shutter:repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 3px,rgba(0,0,0,.30) 3px 7px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text); font-family:var(--body);
  font-size:15px; line-height:1.65; overflow-x:hidden;
  background-image:radial-gradient(120% 60% at 50% 0%,#1d1714 0%,var(--ink) 60%);
  min-height:100dvh;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{max-width:760px;margin:0 auto;padding:0 16px 120px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:60;background:rgba(16,13,11,.86);backdrop-filter:blur(14px)}
.top .band{height:6px;background:var(--chevron)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:900;font-size:14.5px;letter-spacing:-.2px;display:block;line-height:1.25}
.brand span{display:block;font-size:10.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}
.tbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;flex:none;transition:.16s}
.tbtn:active{transform:scale(.93)}
.tbtn.on{background:var(--amber);color:#1a1206;border-color:var(--amber)}
.tbtn svg{width:18px;height:18px}
.lang{font-family:var(--mono);font-size:12px;font-weight:600;width:auto;padding:0 11px}

/* ---------- headings ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--amber);
  text-transform:uppercase;display:flex;align-items:center;gap:8px;margin:26px 0 8px}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h1{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.25;margin:0 0 6px;letter-spacing:-.4px}
h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}

/* ---------- fleet cards ---------- */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-bottom:12px;position:relative;transition:.18s}
.card:active{transform:scale(.988)}
.card .hd{display:flex;align-items:center;gap:12px;padding:13px 14px 6px}
.card .hd .txt{flex:1;min-width:0}
.card .hd h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.card .hd p{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.thumbwrap{padding:0 8px 10px}

/* ---------- truck elevation (signature) ---------- */
.elev{width:100%;height:auto;display:block;direction:ltr}
.elev .bay{cursor:pointer}
.elev .cavity{fill:#0b0908}
.elev .shutter{fill:#9aa3a8;transform-origin:center top;transition:transform .32s cubic-bezier(.3,.9,.3,1),opacity .3s}
.elev .bay.open .shutter{transform:scaleY(.1)}
.elev .baylbl{font-family:var(--mono);font-size:13px;font-weight:600;fill:#0b0908;pointer-events:none}
.elev .bay.open .baylbl{fill:var(--hivis)}
.elev .frame{fill:none;stroke:#0b0908;stroke-width:2}
.elev .bay.open .frame{stroke:var(--amber);stroke-width:2.5}
.elev .cablbl{font-family:var(--mono);font-size:11px;fill:#e9e2da;opacity:.85;pointer-events:none}

/* ---------- specs ---------- */
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0 4px}
.spec{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.spec b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;font-weight:500}
.spec i{font-style:normal;font-size:14px;font-weight:600}

/* ---------- compartment accordion ---------- */
.comp{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--panel);overflow:hidden}
.comp.active{border-color:var(--amber)}
.comp>.ch{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;text-align:start}
.tag{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:600;font-size:13px;background:#0e0c0a;border:1px solid var(--line);color:var(--amber)}
.comp.active .tag{background:var(--amber);color:#1a1206;border-color:var(--amber)}
.comp .ch .t{flex:1;min-width:0}
.comp .ch .t b{display:block;font-weight:600;font-size:14.5px}
.comp .ch .t span{display:block;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.comp.active .chev{transform:rotate(-90deg);color:var(--amber)}
html[dir="rtl"] .chev{transform:scaleX(-1)}
html[dir="rtl"] .comp.active .chev{transform:scaleX(-1) rotate(90deg)}
.body{display:none;padding:0 10px 10px;animation:fade .22s ease}
.comp.active .body{display:block}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ---------- equipment rows ---------- */
.item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;text-align:start;
  border-radius:10px;background:var(--panel2);border:1px solid transparent;margin-bottom:6px;transition:.15s}
.item:active{transform:scale(.99);border-color:var(--line)}
.qty{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--amber)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 0 0 3px rgba(216,35,42,.16)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:14px}
.item .t span{display:block;font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:11px;padding:16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:3px;font-size:14px}
.cnote{border-inline-start:3px solid var(--red);background:rgba(216,35,42,.09);border-radius:8px;
  padding:8px 11px;font-size:12.5px;color:#f0d9d0;margin-bottom:8px}
.thumb{width:36px;height:36px;border-radius:9px;flex:none;background:#0b0908 center/cover no-repeat;border:1px solid var(--line)}
.draw{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:6px 4px 2px;margin-bottom:10px}
.sidehead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sidehead .n{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.prev{height:158px;border-radius:12px;border:1px dashed var(--line);background:#0b0908 center/cover no-repeat;
  display:grid;place-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
.prev.has{border-style:solid;border-color:var(--line)}
.prev i{font-style:normal;background:rgba(0,0,0,.55);padding:5px 12px;border-radius:999px}
.prev.has i{display:none}

/* ---------- equipment detail ---------- */
.hero{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;background:var(--panel)}
.hero .cv{height:8px;background:var(--chevron)}
.hero .shot{background:#0b0908;border-bottom:1px solid var(--line)}
.hero .shot img{display:block;width:100%;max-height:290px;object-fit:cover}
.hero .in{padding:15px 15px 16px}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:3px 9px;
  border-radius:999px;background:rgba(255,192,0,.13);color:var(--amber);border:1px solid rgba(255,192,0,.3)}
.hero h1{margin:9px 0 2px;font-size:23px}
.hero .en{font-family:var(--mono);font-size:12.5px;color:var(--muted);direction:ltr;text-align:start}
.crumb{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 12px}
.sec{border-top:1px solid var(--line);padding:14px 0}
.sec:first-of-type{border-top:0}
.sec>h4{margin:0 0 8px;font-size:12px;font-family:var(--mono);letter-spacing:.12em;color:var(--muted);
  text-transform:uppercase;display:flex;align-items:center;gap:7px;font-weight:500}
.sec>h4::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--amber)}
.sec.danger>h4::before{background:var(--red)}
.sec ul{margin:0;padding-inline-start:18px}
.sec li{margin-bottom:6px}
.sec.danger li::marker{color:var(--red)}
.sec p{margin:0}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin-bottom:9px}
.steps li::before{content:counter(s,decimal);font-family:var(--mono);font-size:11px;font-weight:600;
  width:22px;height:22px;flex:none;border-radius:7px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--amber);margin-top:2px}

/* ---------- side tabs ---------- */
.segs{display:flex;gap:5px;margin:14px 0 10px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:4px}
.segs button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.segs button.on{background:var(--amber);color:#1a1206}
.segs button b{display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;opacity:.7;letter-spacing:.08em}

/* ---------- equipment photo ---------- */
.photo{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#0b0908}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:#0b0908;border:1px solid var(--line)}
.nophoto{aspect-ratio:16/10;display:grid;place-items:center;background:
  repeating-linear-gradient(135deg,#1a1512 0 12px,#15110f 12px 24px);color:var(--muted);font-size:12.5px;
  font-family:var(--mono);gap:6px}
.pick{border:1px dashed var(--line);border-radius:11px;padding:12px;text-align:center;font-size:13px;
  color:var(--muted);width:100%;margin-bottom:6px}
.pick.has{border-style:solid;padding:0;overflow:hidden}
.pick img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.tspecs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px}
.tspec{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.tspec b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;font-weight:500}
.tspec i{font-style:normal;font-size:14px;font-weight:600}

/* ---------- search ---------- */
.searchbar{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;margin-bottom:14px}
.searchbar input{flex:1;background:none;border:0;outline:none;font-size:15px;min-width:0}
.searchbar svg{width:17px;height:17px;color:var(--muted);flex:none}

/* ---------- back / actions ---------- */
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;
  font-family:var(--mono);margin:16px 0 12px}
.back svg{width:15px;height:15px}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 14px;
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:active{transform:scale(.96)}
.btn svg{width:15px;height:15px}
.btn.p{background:var(--amber);color:#1a1206;border-color:var(--amber)}
.btn.d{color:#ff8f93;border-color:#4a2020}
.btn.blk{width:100%;justify-content:center}

/* ---------- sheet / editor ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,4,3,.72);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:95;background:var(--panel);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:88dvh;overflow-y:auto;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
  padding:0 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px}
.sheet h3{font-family:var(--display);font-size:17px;margin:6px 0 14px}
.f{margin-bottom:12px}
.f label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;background:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;outline:none;font-size:14.5px;transition:.15s}
.f input:focus,.f textarea:focus{border-color:var(--amber)}
.f textarea{min-height:88px;resize:vertical;line-height:1.7}
.f .hint{font-size:11px;color:var(--muted);margin-top:4px}
.f.ltr input,.f.ltr textarea{direction:ltr;text-align:start;font-family:var(--mono);font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- misc ---------- */
.toast{position:fixed;inset-inline:0;bottom:22px;margin:0 auto;width:max-content;max-width:90%;
  background:var(--amber);color:#1a1206;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:999px;
  z-index:120;opacity:0;transform:translateY(14px);transition:.24s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.editbadge{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-start:16px;z-index:70;
  background:var(--amber);color:#1a1206;font-family:var(--mono);font-size:11px;font-weight:600;
  padding:7px 13px;border-radius:999px;display:none;align-items:center;gap:6px}
.editbadge.on{display:flex}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-end:16px;z-index:70;
  width:52px;height:52px;border-radius:17px;background:var(--red);display:none;place-items:center;
  box-shadow:0 8px 24px rgba(216,35,42,.4)}
.fab.on{display:grid}
.fab svg{width:22px;height:22px}
.foot{text-align:center;color:var(--muted);font-size:11px;font-family:var(--mono);margin-top:30px;line-height:2}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ============ v2 ============ */
.shell{padding-bottom:118px}
.topin{padding:9px 16px}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:80;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(16,13,11,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;
  color:var(--muted);font-size:10.5px;font-weight:600;border-radius:12px;position:relative;transition:.15s}
.tabs button svg{width:21px;height:21px}
.tabs button.on{color:var(--amber)}
.tabs button.on::before{content:"";position:absolute;top:0;width:22px;height:2.5px;border-radius:2px;background:var(--amber)}
.tabs .bdg{position:absolute;top:2px;inset-inline-end:22%;min-width:16px;height:16px;border-radius:9px;
  background:var(--red);color:#fff;font-size:9.5px;font-family:var(--mono);display:none;place-items:center;padding:0 4px}
.tabs .bdg.on{display:grid}
.fab{bottom:calc(84px + env(safe-area-inset-bottom))}
.editbadge{bottom:calc(84px + env(safe-area-inset-bottom))}

.card{background:linear-gradient(155deg,#2a221c,#1a1512 55%);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.card .hd{padding:14px 15px 4px;align-items:flex-start}
.card .hd h3{font-size:17.5px;letter-spacing:-.2px}
.card .hd p{margin-top:4px;font-size:11px;letter-spacing:.02em}
.codechip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:4px 9px;border-radius:7px;
  background:rgba(255,192,0,.12);color:var(--amber);border:1px solid rgba(255,192,0,.28);white-space:nowrap}
.metarow{display:flex;gap:6px;flex-wrap:wrap;padding:0 15px 10px}
.mtag{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px}
.mtag b{color:var(--text);font-weight:600}

/* بطاقة الحساب */
.acct{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);margin-bottom:14px}
.acct .cv{height:7px;background:var(--chevron)}
.acct .in{padding:16px;display:flex;align-items:center;gap:13px}
.avatar{width:52px;height:52px;border-radius:15px;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--red),var(--red-dk));font-family:var(--display);font-weight:900;font-size:19px;color:#fff}
.acct .who{flex:1;min-width:0}
.acct .who b{display:block;font-family:var(--display);font-size:17px}
.acct .who span{display:block;font-size:12px;color:var(--amber);font-weight:600;margin-top:2px}
.acct .who i{display:block;font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px;direction:ltr;text-align:start}
.acct .rows{border-top:1px solid var(--line)}
.arow{display:flex;align-items:center;gap:11px;width:100%;padding:13px 16px;border-top:1px solid var(--line);text-align:start}
.arow:first-child{border-top:0}
.arow .t{flex:1;min-width:0}
.arow .t b{display:block;font-size:14px;font-weight:600}
.arow .t span{display:block;font-size:11.5px;color:var(--muted)}
.arow .ic{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;flex:none;color:var(--amber)}
.arow .ic svg{width:16px;height:16px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);flex:none;position:relative;transition:.18s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.18s}
.sw.on{background:var(--amber);border-color:var(--amber)}
.sw.on::after{inset-inline-start:20px;background:#1a1206}

/* الإشعارات */
.notice{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:13px 14px;margin-bottom:10px;position:relative}
.notice.new{border-color:rgba(255,192,0,.45)}
.notice.new::before{content:"";position:absolute;top:14px;inset-inline-start:-1px;width:3px;height:22px;
  border-radius:0 3px 3px 0;background:var(--amber)}
.notice h4{margin:0 0 5px;font-size:15px;font-family:var(--display);font-weight:700}
.notice p{margin:0;font-size:13.5px;color:#dcd2c8;white-space:pre-wrap}
.notice time{display:block;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}

const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const v = window.localStorage && localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; }
  },
  async set(k,v){
    const s = JSON.stringify(v);
    try{ if(window.storage){ await window.storage.set(k,s); return true; } }catch(e){}
    try{ localStorage.setItem(k,s); return true; }catch(e){ return false; }
  },
  async del(k){
    try{ if(window.storage){ await window.storage.delete(k); return; } }catch(e){}
    try{ localStorage.removeItem(k); }catch(e){}
  },
  async keys(prefix){
    try{ if(window.storage){ const r = await window.storage.list(prefix); return (r&&r.keys)||[]; } }catch(e){}
    try{ return Object.keys(localStorage).filter(k=>k.startsWith(prefix)); }catch(e){ return []; }
  }
};
