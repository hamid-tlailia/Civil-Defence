const normName = v => String(v||'')
  .replace(/\.[a-z0-9]+$/i,'')
  .replace(/[\u064B-\u0652\u0640]/g,'')
  .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
  .replace(/[()_\-\[\]·.,]/g,' ')
  .replace(/\s+/g,' ')
  .trim().toLowerCase();

document.getElementById('bulkIn').addEventListener('change', async e => {
  const files = [...(e.target.files||[])];
  e.target.value = '';
  if(!files.length) return;
  if(!admin){ toast(T('needLogin')); return; }

  const index = {};
  DB.vehicles.forEach(v => v.compartments.forEach(c => c.items.forEach(it => {
    const a = normName(it.name.ar), b = normName(it.name.en);
    if(a && !index[a]) index[a] = [];
    if(a) index[a].push(it.id);
    if(b && b!==a){ if(!index[b]) index[b] = []; index[b].push(it.id); }
  })));

  let linked = 0; const missed = [];
  toast(T('syncing'));
  for(const f of files){
    const key = normName(f.name);
    const ids = index[key];
    if(!ids){ missed.push(f.name); continue; }
    try{
      const data = await shrinkImage(f);
      for(const id of ids) await setImage(id, data);
      linked += ids.length;
    }catch(err){ missed.push(f.name); }
  }
  await save(); render();
  alertModal(`${linked} ${T('bulkDone')}` + (missed.length
    ? `\n\n${lang?'Not matched:':'لم تُطابق:'}\n` + missed.slice(0,12).join('\n') + (missed.length>12?'\n…':'')
    : ''));
});

/* ---------- المزامنة مع الخادم ---------- */
async function pullRemote(silent){
  if(!WORKER_URL) return;
  try{
    const r = await fetch(WORKER_URL.replace(/\/$/,'') + '/data', {cache:'no-store'}).then(x=>x.json());
    if(!r || !r.ok || !r.data || !r.data.vehicles) return;
    const remoteAt = Number(r.updated) || 0;
    const localAt  = Number(await store.get('qcd_synced')) || 0;
    if(remoteAt <= localAt) return;
    DB = applyDocEn(applyDoc(r.data));
    if(!DB.notices) DB.notices = [];
    if(r.images) for(const k in r.images) await setImage(k, r.images[k]);
    await save();
    await store.set('qcd_synced', remoteAt);
    render(); updateBadge();
    if(!silent) toast(T('pulled'));
    else pushLocal(lang?'Fleet updated':'تحديث الأسطول', T('pulled'));
  }catch(e){}
}

async function publishData(){
  if(!admin){ toast(T('needLogin')); return; }
  const sa = await store.get('qcd_admin');
  const token = sa && sa.token;
  if(!WORKER_URL || !token){
    alertModal(lang ? 'Publishing needs the Worker and a signed-in session.'
                    : 'النشر يحتاج ربط الـWorker وتسجيل دخول جديد بالبريد.');
    return;
  }
  btnBusy('pubBtn', true, T('publishing'));
  try{
    const r = await fetch(WORKER_URL.replace(/\/$/,'') + '/publish', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({token, data: DB, images: IMGS})
    });
    const j = await r.json().catch(()=>({}));
    btnBusy('pubBtn', false);
    if(!r.ok || !j.ok){ alertModal((lang?'Publish failed: ':'فشل النشر: ') + (j.error || r.status)); return; }
    await store.set('qcd_synced', j.updated || Date.now());
    toast(T('publishOk'));
  }catch(e){
    btnBusy('pubBtn', false);
    alertModal((lang?'Publish failed: ':'فشل النشر: ') + String(e.message || e));
  }
}

/* ---------- الإشعارات ---------- */
function editNotice(){
  if(!admin) return;
  openSheet(`<h3>${T('newNotice')}</h3>
    ${field('n_t',T('nTitle'),'')}
    <div class="f"><label for="n_b">${T('nBody')}</label><textarea id="n_b"></textarea></div>
    <div class="actions" style="margin-bottom:6px">
      <button class="btn p" style="flex:1;justify-content:center" onclick="publishNotice()">${T('publish')}</button>
      <button class="btn" onclick="closeSheet()">${T('cancel')}</button>
    </div>`);
}
async function publishNotice(){
  const title = val('n_t'), body = val('n_b');
  if(!title && !body){ closeSheet(); return; }
  if(!DB.notices) DB.notices = [];
  const n = {id:uid('n'), at:Date.now(), title:title||(lang?'Notice':'إشعار'), body:body};
  DB.notices.push(n);
  READ = READ.concat([n.id]);
  await store.set('qcd_read', READ);
  await save(); closeSheet(); go('#/notices'); render();
  pushLocal(nt(n.title), nt(n.body));
  toast(T('published'));
}
async function delNotice(id){
  if(!await askConfirm(T('confirmDel'), true)) return;
  DB.notices = (DB.notices||[]).filter(n=>n.id!==id);
  await save(); render(); toast(T('deleted'));
}

/* ---------- تنبيهات الجهاز ---------- */
function pushStatusText(){
  if(!('Notification' in window)) return lang?'Not supported on this device':'غير مدعومة على هذا الجهاز';
  if(Notification.permission==='granted') return T('pushOn');
  if(Notification.permission==='denied') return T('pushBlocked');
  return lang?'Tap to enable':'اضغط للتفعيل';
}
async function askPush(){
  if(!('Notification' in window)){ toast(pushStatusText()); return; }
  try{
    const r = await Notification.requestPermission();
    render();
    toast(r==='granted' ? T('pushOn') : T('pushBlocked'));
  }catch(e){ toast(T('pushBlocked')); }
}
function pushLocal(title, body){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title, {body:(body||'').slice(0,160), tag:'qcd'});
    }
  }catch(e){}
}

async function toggleEdit(){
  if(!admin){ openLogin(); return; }
  editMode = !editMode; await store.set('qcd_edit',editMode); render();
  toast(editMode?(lang?'Edit mode on':'وضع التعديل مُفعّل'):(lang?'Edit mode off':'وضع التعديل مُعطّل'));
}
function exportWord(){
  if(!admin){ toast(T('adminOnly')); return; }
  const esc2 = x => esc(x||'');
  const li = v => lines(t(v)).map(x=>`<li>${esc2(x)}</li>`).join('');
  let body = `<h1 style="color:#A81B2D">${esc2(T('acadT'))}</h1>
    <p style="color:#666">${esc2(T('disclaimer'))} — ${new Date().toLocaleDateString('ar-QA')}</p>`;
  DB.vehicles.forEach(v=>{
    body += `<h2 style="color:#A81B2D;border-bottom:2px solid #F3C13A">${esc2(t(v.name))} — ${esc2(v.code)}</h2>
      <p>${esc2(v.maker)} · ${esc2(t(v.note))}</p>`;
    v.compartments.forEach(c=>{
      if(!c.items.length) return;
      body += `<h3 style="background:#F3C13A;padding:4px 8px">${esc2(t(c.name))} (${c.items.length})</h3>`;
      c.items.forEach((it,i)=>{
        body += `<table border="1" cellspacing="0" cellpadding="6" width="100%" style="border-collapse:collapse;margin-bottom:10px">
          <tr><td width="22%" bgcolor="#FDF3D6"><b>${esc2(T('nameLbl'))}</b></td><td><b>${esc2(t(it.name))}</b>${it.qty?` — ×${esc2(it.qty)}`:''} <span style="color:#888">${esc2(catT(it.cat))}</span></td></tr>`;
        const row = (lbl,val,kind) => { const L = lines(t(val)); if(!L.length) return '';
          return `<tr><td bgcolor="#FDF3D6"><b>${esc2(lbl)}</b></td><td>${
            L.length===1 ? esc2(L[0]) : (kind==='ol'?`<ol>${li(val)}</ol>`:`<ul>${li(val)}</ul>`)}</td></tr>`; };
        body += row(T('defT'), it.def) + row(T('usesLbl'), it.uses) + row(T('howLbl'), it.howto,'ol')
              + row(T('hazLbl'), it.hazards) + row(T('techLbl'), it.tech) + row(T('notesLbl'), it.notes);
        body += `</table>`;
      });
    });
  });
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${esc2(T('acadT'))}</title>
    <style>body{font-family:Arial,Tahoma;direction:rtl}table{font-size:11pt}h1,h2,h3{font-family:Arial}</style>
    </head><body dir="rtl">${body}</body></html>`;
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'أسطول-الدفاع-المدني-' + new Date().toISOString().slice(0,10) + '.doc';
  a.click(); URL.revokeObjectURL(a.href);
}

function exportJSON(){
  if(!admin){ toast(T('adminOnly')); return; }
  const b = new Blob([JSON.stringify({...DB, images:IMGS},null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'qcd-fleet-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
document.getElementById('fileIn').addEventListener('change',async e=>{
  const f = e.target.files[0]; if(!f) return;
  if(!admin){ toast(T('adminOnly')); e.target.value=''; return; }
  try{
    const d = JSON.parse(await f.text());
    if(!d.vehicles) throw new Error('bad');
    if(d.images){ for(const k in d.images) await setImage(k, d.images[k]); delete d.images; }
    DB = d; await save(); closeSheet(); go('#/'); render(); toast(T('imported'));
  }catch(err){ toast(lang?'File not readable — expected the app\'s JSON export.':'الملف غير صالح — المتوقع ملف JSON مُصدَّر من التطبيق.'); }
  e.target.value = '';
});
async function resetData(){
  if(!admin){ toast(T('adminOnly')); return; }
  if(!await askConfirm(lang?'Replace all current content with the original data?':'استبدال كل المحتوى الحالي بالبيانات الأصلية؟', true)) return;
  DB = applyDocEn(applyDoc(seed())); await save(); go('#/'); render(); toast(T('resetOk'));
}
async function doInstall(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; }
  else toast(lang?'Open in a browser, then use "Add to Home Screen".':'افتحه في المتصفح ثم اختر «إضافة إلى الشاشة الرئيسية».');

function showUpdateBar(reg){
  const el = document.getElementById('updBar');
  if(!el) return;
  el.classList.add('on');
  el.onclick = () => {
    try{ if(reg && reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); }catch(e){}
    setTimeout(()=>location.reload(), 300);
  };
}
if('serviceWorker' in navigator && location.protocol==='https:'){
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(swReloaded) return; swReloaded = true;
    location.reload();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(reg=>{
    if(!reg) return;
    if(reg.waiting) showUpdateBar(reg);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if(!nw) return;
      nw.addEventListener('statechange', () => {
        if(nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar(reg);
      });
    });
    reg.update().catch(()=>{});
    setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') reg.update().catch(()=>{});
    });
  }).catch(()=>{}));
}

/* =========================================================
   12. الإقلاع
   ========================================================= */
(async function boot(){
  IMGS = {};
  try{
    const ks = await store.keys(IMGK);
    for(const k of ks){ const d = await store.get(k); if(d) IMGS[k.slice(IMGK.length)] = d; }
  }catch(e){}
  const saved = await store.get(KEY);
  let refreshed = false;
  if(saved && saved.vehicles){
    if((saved.version || 0) < DATA_VERSION){
      const keep = saved.notices || [];
      DB = applyDocEn(applyDoc(seed()));
      DB.notices = keep.concat(DB.notices.filter(n=>!keep.some(k=>nt(k.title)===nt(n.title))));
      DB.notices.push({id:uid('n'), at:Date.now(),
        title:{ar:'تم تحديث بيانات التطبيق', en:'App data updated'},
        body:{ar:'وصلتك أحدث نسخة من بيانات الأسطول والمعدات. صورك ومعلوماتك المحفوظة على الجهاز لم تتأثر.',
              en:'You now have the latest fleet and equipment data. Your photos and local entries are untouched.'}});
      await save(); refreshed = true;
    } else DB = saved;
  } else await save();
  const sl = await store.get('qcd_lang'); if(sl===1) toggleLang();
  const th = await store.get('qcd_theme');
  if(th === 'dark' || (!th && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) theme = 'dark';
  applyTheme();
  const sa = await store.get('qcd_admin');
  if(sa && sa.at && (Date.now() - sa.at) < 30*24*3600*1000){ admin = true; adminEmail = sa.email || ''; }
  else if(sa) await store.del('qcd_admin');
  const se = await store.get('qcd_edit'); if(se && admin) editMode = true;
  // ترحيل الإشعارات القديمة (نص واحد) إلى صيغة ثنائية اللغة، وحذف المكرر
  if(DB.notices && DB.notices.length){
    const MAP = {
      'تم تحديث بيانات التطبيق': {t:{ar:'تم تحديث بيانات التطبيق',en:'App data updated'},
        b:{ar:'وصلتك أحدث نسخة من بيانات الأسطول والمعدات. صورك ومعلوماتك المحفوظة على الجهاز لم تتأثر.',
           en:'You now have the latest fleet and equipment data. Your photos and local entries are untouched.'}},
      'مرحبًا بكم في تطبيق الأسطول': {t:{ar:'مرحبًا بكم في تطبيق الأسطول',en:'Welcome to the Fleet app'},
        b:{ar:'هذا التطبيق مرجع تدريبي لأفراد الدفاع المدني الجدد: كل سيارة، وكل خانة فيها، وكل معدة مع استعمالاتها وطريقة استعمالها ومخاطرها.',
           en:'A training reference for new civil defence personnel: every appliance, every compartment, and every item with its uses, handling steps and hazards.'}}
    };
    DB.notices.forEach(n=>{
      const key = typeof n.title === 'string' ? n.title : (n.title && n.title.ar);
      const m = MAP[key];
      if(m){ n.title = m.t; n.body = m.b; }
    });
    const seen = {};
    DB.notices = DB.notices.slice().sort((a,b)=>b.at-a.at).filter(n=>{
      const k = nt(n.title);
      if(!MAP[k]) return true;              // إشعارات المدير تبقى كلها
      if(seen[k]) return false;             // أبقِ الأحدث فقط من الإشعارات التلقائية
      seen[k] = 1; return true;
    });
    await save();
  }
  READ = (await store.get('qcd_read')) || [];
  setTimeout(()=>pullRemote(true), 1200);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pullRemote(true); });
  if(refreshed) setTimeout(()=>toast(T('updated')), 900);
  if(!DB.notices) DB.notices = [];
  render();
})();
