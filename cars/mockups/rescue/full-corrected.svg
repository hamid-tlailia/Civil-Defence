<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Civil defence rescue tender, two side compartments and rear crane">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbf8f1"/><stop offset="1" stop-color="#eee7dc"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eff143"/><stop offset="1" stop-color="#cbd11e"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f3f4"/><stop offset=".5" stop-color="#aeb7bb"/><stop offset="1" stop-color="#e6ebec"/></linearGradient>
    <linearGradient id="cabglass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65818b"/><stop offset="1" stop-color="#18262d"/></linearGradient>
    <pattern id="roller" width="16" height="9" patternUnits="userSpaceOnUse"><rect width="16" height="9" fill="url(#silver)"/><path d="M0 8.5h16" stroke="#7d878d" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="606" cy="560" rx="475" ry="34" fill="#746d61" opacity=".2" filter="url(#shadow)"/>

  <!-- main body: rescue tender -->
  <path d="M135 453V317l74-122h209l47 49h422l44 42v167H135Z" fill="url(#yellow)" stroke="#706f28" stroke-width="5" stroke-linejoin="round"/>
  <path d="M135 453h796v45H135z" fill="#f5f6f2" stroke="#70746e" stroke-width="4"/>
  <path d="M163 453h738v-30H163z" fill="#cc2632"/>
  <path d="M164 423h738" stroke="#f1e736" stroke-width="14" stroke-dasharray="24 18"/>

  <!-- cab -->
  <path d="M160 317l60-98h165l34 35v138H160z" fill="#dce034" stroke="#6c701e" stroke-width="4"/>
  <path d="M183 314l49-78h86v78z" fill="url(#cabglass)" stroke="#18252c" stroke-width="7" stroke-linejoin="round"/>
  <path d="M325 236h52l25 30v48h-77z" fill="url(#cabglass)" stroke="#18252c" stroke-width="7" stroke-linejoin="round"/>
  <rect x="343" y="337" width="34" height="13" rx="5" fill="#202a2e"/>
  <rect x="144" y="355" width="35" height="16" rx="5" fill="#1b2225"/>
  <path d="M185 381l146-61v67z" fill="#c82631" opacity=".95"/>
  <path d="M185 398l154-64" stroke="#f1e736" stroke-width="11" stroke-dasharray="22 13"/>
  <path d="M152 388h44M158 407h51" stroke="#e6e8e6" stroke-width="8"/>

  <!-- body structure and exactly two compartments -->
  <rect x="441" y="265" width="430" height="22" fill="#e9ece9" stroke="#737b7d" stroke-width="3"/>
  <rect x="450" y="292" width="185" height="126" rx="7" fill="url(#roller)" stroke="#454e50" stroke-width="7"/>
  <rect x="662" y="292" width="185" height="126" rx="7" fill="url(#roller)" stroke="#454e50" stroke-width="7"/>
  <path d="M456 396h174M668 396h174" stroke="#242c2e" stroke-width="8"/>
  <circle cx="540" cy="397" r="5" fill="#1e2628"/><circle cx="751" cy="397" r="5" fill="#1e2628"/>
  <path d="M641 288v130" stroke="#9da528" stroke-width="18"/>
  <rect x="443" y="432" width="406" height="21" fill="#d8dd2a" stroke="#7e8322" stroke-width="3"/>

  <!-- roof equipment -->
  <path d="M450 248h360l-19-42H472z" fill="#d7dce0" stroke="#626d70" stroke-width="5"/>
  <path d="M480 216h282M490 199h260" stroke="#6e797e" stroke-width="7"/>
  <path d="M510 185v49M590 185v49M670 185v49M750 185v49" stroke="#6e797e" stroke-width="6"/>
  <rect x="239" y="183" width="95" height="13" rx="6" fill="#1f292d"/><rect x="244" y="187" width="40" height="5" rx="2" fill="#2379c5"/>

  <!-- rear crane only for rescue -->
  <g transform="translate(870 196)" stroke="#242a29" stroke-linejoin="round">
    <rect x="0" y="182" width="91" height="81" rx="5" fill="#272e2d" stroke-width="7"/>
    <path d="M20 191l15-153 35 12-10 125z" fill="#d8df2a" stroke-width="10"/>
    <path d="M57 59l74-51 20 28-84 78z" fill="#d8df2a" stroke-width="10"/>
    <path d="M134 31l36 23-26 26" fill="none" stroke="#222a2a" stroke-width="10"/>
    <circle cx="45" cy="62" r="15" fill="#343a39" stroke-width="8"/>
    <path d="M164 57v74" stroke="#242a29" stroke-width="7"/><path d="M151 132h28" stroke="#c82631" stroke-width="10"/>
  </g>

  <!-- wheels -->
  <g fill="#1c2020" stroke="#101414" stroke-width="5"><circle cx="287" cy="500" r="67"/><circle cx="724" cy="500" r="65"/><circle cx="854" cy="500" r="65"/></g>
  <g fill="#889297" stroke="#d6ddde" stroke-width="5"><circle cx="287" cy="500" r="27"/><circle cx="724" cy="500" r="26"/><circle cx="854" cy="500" r="26"/></g>
  <g fill="#3b4447"><circle cx="287" cy="500" r="10"/><circle cx="724" cy="500" r="10"/><circle cx="854" cy="500" r="10"/></g>
  <path d="M216 502h-50M795 502h-33M926 502h22" stroke="#1c2423" stroke-width="10"/>
</svg>
