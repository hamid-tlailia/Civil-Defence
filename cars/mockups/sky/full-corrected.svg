<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Civil defence heavy SKYCAF appliance, two side compartments and no rear crane">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbf8f1"/><stop offset="1" stop-color="#eee7dc"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eff143"/><stop offset="1" stop-color="#cbd11e"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f3f4"/><stop offset=".5" stop-color="#aeb7bb"/><stop offset="1" stop-color="#e6ebec"/></linearGradient>
    <linearGradient id="cabglass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65818b"/><stop offset="1" stop-color="#18262d"/></linearGradient>
    <pattern id="roller" width="16" height="9" patternUnits="userSpaceOnUse"><rect width="16" height="9" fill="url(#silver)"/><path d="M0 8.5h16" stroke="#7d878d" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <ellipse cx="606" cy="560" rx="465" ry="34" fill="#746d61" opacity=".2" filter="url(#shadow)"/>

  <!-- main body: heavy SKYCAF appliance, no crane -->
  <path d="M130 453V317l74-122h210l47 49h420l56 42v167H130Z" fill="url(#yellow)" stroke="#706f28" stroke-width="5" stroke-linejoin="round"/>
  <path d="M130 453h807v45H130z" fill="#f5f6f2" stroke="#70746e" stroke-width="4"/>
  <path d="M145 453h777v-30H145z" fill="#cc2632"/>
  <path d="M145 423h777" stroke="#f1e736" stroke-width="14" stroke-dasharray="24 18"/>

  <!-- cab -->
  <path d="M155 317l60-98h165l34 35v138H155z" fill="#dce034" stroke="#6c701e" stroke-width="4"/>
  <path d="M178 314l49-78h86v78z" fill="url(#cabglass)" stroke="#18252c" stroke-width="7" stroke-linejoin="round"/>
  <path d="M320 236h52l25 30v48h-77z" fill="url(#cabglass)" stroke="#18252c" stroke-width="7" stroke-linejoin="round"/>
  <rect x="338" y="337" width="34" height="13" rx="5" fill="#202a2e"/>
  <rect x="139" y="355" width="35" height="16" rx="5" fill="#1b2225"/>
  <path d="M180 381l146-61v67z" fill="#c82631" opacity=".95"/>
  <path d="M180 398l154-64" stroke="#f1e736" stroke-width="11" stroke-dasharray="22 13"/>
  <path d="M147 388h44M153 407h51" stroke="#e6e8e6" stroke-width="8"/>

  <!-- body structure and exactly two compartments -->
  <rect x="436" y="265" width="434" height="22" fill="#e9ece9" stroke="#737b7d" stroke-width="3"/>
  <rect x="445" y="292" width="190" height="126" rx="7" fill="url(#roller)" stroke="#454e50" stroke-width="7"/>
  <rect x="662" y="292" width="190" height="126" rx="7" fill="url(#roller)" stroke="#454e50" stroke-width="7"/>
  <path d="M451 396h178M668 396h178" stroke="#242c2e" stroke-width="8"/>
  <circle cx="538" cy="397" r="5" fill="#1e2628"/><circle cx="756" cy="397" r="5" fill="#1e2628"/>
  <path d="M641 288v130" stroke="#9da528" stroke-width="18"/>
  <rect x="438" y="432" width="414" height="21" fill="#d8dd2a" stroke="#7e8322" stroke-width="3"/>

  <!-- roof boom and firefighting equipment, not a crane -->
  <path d="M441 246h380l-22-33H472z" fill="#e3e6e4" stroke="#626d70" stroke-width="5"/>
  <path d="M483 211h298M496 193h268" stroke="#737e80" stroke-width="7"/>
  <path d="M520 182v52M610 182v52M700 182v52M774 182v52" stroke="#737e80" stroke-width="6"/>
  <g transform="translate(477 113)" stroke="#525d60" stroke-linejoin="round">
    <path d="M0 89h300l45-37H14z" fill="#d9dfe0" stroke-width="8"/>
    <path d="M340 52l66 8-10 29-67-6z" fill="#d9dfe0" stroke-width="8"/>
    <circle cx="403" cy="75" r="13" fill="#263136" stroke-width="7"/>
    <path d="M403 62l30-15" stroke="#263136" stroke-width="10"/>
  </g>
  <rect x="232" y="183" width="95" height="13" rx="6" fill="#1f292d"/><rect x="237" y="187" width="40" height="5" rx="2" fill="#2379c5"/>

  <!-- clean rear equipment block: deliberately no crane -->
  <rect x="870" y="298" width="52" height="116" rx="5" fill="#d8dd2a" stroke="#717722" stroke-width="4"/>
  <path d="M879 315h34M879 335h34M879 355h34" stroke="#a7af26" stroke-width="7"/>
  <rect x="879" y="379" width="34" height="18" rx="4" fill="#465153"/>

  <!-- wheels -->
  <g fill="#1c2020" stroke="#101414" stroke-width="5"><circle cx="282" cy="500" r="67"/><circle cx="719" cy="500" r="65"/><circle cx="849" cy="500" r="65"/></g>
  <g fill="#889297" stroke="#d6ddde" stroke-width="5"><circle cx="282" cy="500" r="27"/><circle cx="719" cy="500" r="26"/><circle cx="849" cy="500" r="26"/></g>
  <g fill="#3b4447"><circle cx="282" cy="500" r="10"/><circle cx="719" cy="500" r="10"/><circle cx="849" cy="500" r="10"/></g>
  <path d="M211 502h-50M790 502h-33M921 502h22" stroke="#1c2423" stroke-width="10"/>
</svg>
